<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>

<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#06080c">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#06080c;--card:rgba(14,17,24,.86);--text:#e8edf3;--muted:#8a96a6;--line:#222a36;--accent:#7fb6e8;--shadow:0 8px 30px rgba(0,0,0,.5);--s0:#3a4452;--s1:#ffb020;--s2:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#06080c;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none}
#stage.hov{cursor:pointer}
#tags{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tag{position:absolute;left:0;top:0;will-change:transform,opacity;pointer-events:none}
.tag .txt{position:absolute;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;text-align:center}
.tag b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em;color:#fff;}
.tag small{display:block;font-size:11px;color:#8794a6;margin-top:3px;letter-spacing:.02em}
.tag i{display:block;font-style:normal;font:500 10px ui-monospace,Menlo,monospace;color:var(--c);letter-spacing:.14em;margin-bottom:3px;text-transform:uppercase}
.tag.click .txt,.tag.itm .txt{pointer-events:auto;cursor:pointer}
.tag.itm .txt{transform:translate(12px,-50%);text-align:left}
.tag.itm.r .txt{transform:translate(calc(-100% - 12px),-50%);text-align:right}
.tag.itm .txt:hover b{text-shadow:0 0 12px var(--c)}
.tag.itm b{font-size:14px}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;z-index:3;pointer-events:none}
.top>*{pointer-events:auto}
.btn{background:#0d1118cc;border:1px solid #232c3a;color:#b6c2d0;border-radius:980px;padding:7px 16px;font-size:13px;backdrop-filter:blur(8px)}
.btn:hover{color:#fff;border-color:#4a5a70}
.right{display:flex;gap:8px}
#back{opacity:0;pointer-events:none;transition:opacity .4s}
#back.on{opacity:1;pointer-events:auto}
.pct{position:fixed;left:20px;bottom:16px;z-index:3;font:500 11px ui-monospace,Menlo,monospace;color:#5d6a7c;letter-spacing:.12em}
.grid{display:none;margin:70px 16px 24px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;position:relative;z-index:2}
.mcard{background:var(--card);border-radius:18px;padding:18px;text-align:left;border:1px solid var(--line)}
.mcard .ic{font-size:28px}.mcard b{display:block;font-size:17px;margin-top:4px}.mcard small{color:var(--muted)}
.bar{height:5px;border-radius:5px;background:#1a212c;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
body.no3d{overflow:auto}body.no3d #stage,body.no3d #gl,body.no3d #tags{display:none}body.no3d .grid{display:grid}
@media (max-width:640px){body{overflow:auto}#stage,#gl{display:none}.grid{display:grid}}
/* sheet overrides */
.item,.why,table,.mnav button,.tools span,.mcard{border-color:#232c3a}
.hero{border-radius:14px}.item,.why{border-radius:14px}
.back{background:var(--card);color:var(--text);border:1px solid #232c3a}
.stbtn{background:#0b0f15;border-color:#232c3a}
.item.hl{border-color:var(--accent);box-shadow:0 0 22px #7fb6e855}
.act{border-color:var(--accent);color:var(--accent)}.act:hover{background:var(--accent);color:#06101a}

/* ---------- detail sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);overflow-y:auto;overscroll-behavior:contain}
#sheet.open{display:block;animation:sheetin .5s cubic-bezier(.2,.8,.2,1)}
#sheet.closing{animation:sheetout .28s ease forwards}
@keyframes sheetin{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes sheetout{to{opacity:0;transform:scale(.8)}}
.sheetin{max-width:980px;margin:0 auto;padding:18px 20px 80px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.back{border:0;background:var(--card);border-radius:980px;padding:9px 18px;font-size:14px;box-shadow:var(--shadow)}
.hero{border-radius:28px;padding:34px 30px;color:#fff}
.hero .ic{font-size:50px}.hero h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin:6px 0}
.hero p{margin:0;opacity:.93;font-size:16px;max-width:640px;line-height:1.55}
.hero .bar{background:#ffffff40;max-width:360px}.hero .bar i{background:#fff}
.hero small{display:block;margin-top:10px;opacity:.9}
.why{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-top:14px;font-size:14px;line-height:1.6;color:var(--muted)}
.why b{color:var(--text)}
.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:28px 0 12px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s,border-color .3s}
.item.hl{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.item h3{margin:0;font-size:18px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;background:var(--bg);color:var(--muted)}
.item p{margin:0;font-size:14px;color:var(--muted);line-height:1.55}
.item .k{font-size:12px;font-weight:700;color:var(--text);display:block;margin-bottom:2px}
.stbtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;text-align:left;display:flex;align-items:center;gap:8px;margin-top:auto}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:980px;padding:6px 13px;font-size:12.5px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.act em{font-style:normal;opacity:.7;font-weight:400}
.act:hover{background:var(--accent);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px}.tools span{background:var(--card);border:1px solid var(--line);border-radius:980px;padding:6px 14px;font-size:13px}
.mnav{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.mnav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;text-align:left}
.mnav button small{color:var(--muted);display:block}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:16px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.6;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
td,th{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}tr:last-child td{border:0}th{color:var(--muted);font-size:12px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

function tex(sz,draw){const c=document.createElement('canvas');c.width=c.height=sz;draw(c.getContext('2d'),sz);return new THREE.CanvasTexture(c)}
function makeTex(){
  T_DOT=tex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.9)');r.addColorStop(.55,'rgba(255,255,255,.25)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
  T_GLOW=tex(256,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.12,'rgba(255,255,255,.5)');r.addColorStop(.4,'rgba(255,255,255,.12)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
}
function fib(n,r,off){const a=[];for(let i=0;i<n;i++){const y=1-2*(i+.5+(off||0))/n,rad=Math.sqrt(Math.max(0,1-y*y)),th=i*2.399963;a.push(new THREE.Vector3(Math.cos(th)*rad*r,y*r,Math.sin(th)*rad*r))}return a}

function buildCluster(k,m){
  const items=m.items.length, r=6.2+items*.55, n=170+items*20, col=new THREE.Color(m.color);
  const g=new THREE.Group(), pts=fib(n,r);
  pts.forEach((p,i)=>{p.multiplyScalar(i%9===0?rnd(.35,.9):1+rnd(-.035,.035))});
  // 점
  const pos=new Float32Array(n*3), cl=new Float32Array(n*3);
  pts.forEach((p,i)=>{pos.set([p.x,p.y,p.z],i*3);const b=.55+.45*Math.random();cl.set([col.r*b,col.g*b,col.b*b],i*3)});
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(cl,3));
  const pm=new THREE.PointsMaterial({size:.62,map:T_DOT,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  const points=new THREE.Points(pg,pm); g.add(points);
  // 선: 각 점에서 가까운 2~3개
  const seg=[],seen=new Set();
  pts.forEach((p,i)=>{const d=pts.map((q,j)=>[j,p.distanceToSquared(q)]).filter(x=>x[0]!==i).sort((a,b)=>a[1]-b[1]).slice(0,3);
    d.forEach(([j])=>{const key=i<j?i+'_'+j:j+'_'+i;if(seen.has(key))return;seen.add(key);seg.push(p.x,p.y,p.z,pts[j].x,pts[j].y,pts[j].z)})});
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(seg,3));
  const lm=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.34,blending:THREE.AdditiveBlending,depthWrite:false});
  const lines=new THREE.LineSegments(lg,lm); g.add(lines);
  // 항목 노드
  const ipos=fib(items,r*1.0,.3), nodes=[];
  ipos.forEach((p,i)=>{
    const st=getSt(m,i), br=[.55,.85,1.2][st];
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:T_GLOW,color:col,transparent:true,opacity:.9*Math.min(1,br),blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
    const core=new THREE.Sprite(new THREE.SpriteMaterial({map:T_DOT,color:0xffffff,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
    halo.position.copy(p);core.position.copy(p);halo.scale.setScalar(0);core.scale.setScalar(0);g.add(halo,core);
    nodes.push({p,halo,core,i});
  });
  // 호버/클릭용 보이지 않는 구
  const hit=new THREE.Mesh(new THREE.SphereGeometry(r*1.05,16,12),new THREE.MeshBasicMaterial({visible:false}));hit.userData.k=k;g.add(hit);
  g.userData={k,r,pm,lm,nodes,hit,col,spin:rnd(.7,1.3)*(k%2?1:-1)};
  g.rotation.set(rnd(0,3),rnd(0,3),0);
  return g;
}
function layout(k,n){ // 영상처럼 가운데 노드 주변에 배치
  const a=k*2*Math.PI/n-Math.PI/2+.25, R=22+ (k%2)*3;
  return new THREE.Vector3(Math.cos(a)*R*1.15, Math.sin(a)*R*.8, ((k*37)%5-2)*2.2);
}
function addTag(cls,color,code,title,sub,fn,anchor,off){

  el.innerHTML=`<div class="txt">${code?`<i>${code}</i>`:''}<b>${title}</b>${sub?`<small>${sub}</small>`:''}</div>`;
  tagsEl.appendChild(el);

  if(fn) el.querySelector('.txt').addEventListener('click',e=>{if(moved)return;fn(e)});
  tags.push(t); return t;
}

function build(){
  if(!HAS3D)return;
  if(world) scene.remove(world);
  world=new THREE.Group(); scene.add(world); clusters=[]; tags=[]; tagsEl.innerHTML='';
  const n=MODS.length;

  const core=new THREE.Group();
  const cg=new THREE.Sprite(new THREE.SpriteMaterial({map:T_GLOW,color:0xffa24d,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));cg.scale.setScalar(5);
  const cc=new THREE.Sprite(new THREE.SpriteMaterial({map:T_DOT,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));cc.scale.setScalar(1.3);
  core.add(cg,cc); world.add(core); coreObj=core;
  addTag('core','#ffa24d','','','가동률 '+allPct()+'%',null,core,new THREE.Vector3(0,-2.2,0));
  MODS.forEach((m,k)=>{
    const g=buildCluster(k,m); g.position.copy(layout(k,n)); world.add(g); clusters.push(g);
    // 가운데 노드와 연결선
    const lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),g.position.clone()]);
    const ln=new THREE.Line(lg,new THREE.LineBasicMaterial({color:m.color,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));world.add(ln);g.userData.link=ln;
    const u=g.userData;
    u.tag=addTag('click',m.color,'0'+(k+1)+' · '+modPct(m)+'%',m.name,m.items.slice(0,3).map(i=>i.s).join(' · '),e=>zoomTo(k),g,new THREE.Vector3(0,-u.r*1.12,0));
    u.itemTags=m.items.map((it,i)=>{const nd=u.nodes[i];
      return addTag('itm',['#7d8896','#ffb020','#3ddc97'][getSt(m,i)],['구상','구축중','운영중'][getSt(m,i)],it.s,LV[it.lv].replace(/^\S+\s/,''),e=>openMod(k,i,e),g,nd.p);});
    u.allTag=addTag('click',m.color,'전체 상세 ›','','',e=>openMod(k,null,e),g,new THREE.Vector3(0,u.r*1.2,0));

  });

let last=performance.now();
const V=new THREE.Vector3(), TG=new THREE.Vector3(), CP=new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  if(!HAS3D||document.body.classList.contains('sheet-open')){last=now;return}
  const dt=Math.min(50,now-last);last=now;tt+=dt/1000;
  vt=clamp(vt+(view!==null?1:-1)*dt/1300,0,1); const e=ease(vt);
  const W=innerWidth,H=innerHeight,asp=W/H, kk=clusters[fk];
  // 카메라 목표
  const gal=new THREE.Vector3(0,0,0), galDist=98/Math.min(1,asp)/zoom;
  if(kk){ TG.copy(gal).lerp(kk.position,e) } else TG.copy(gal);
  const zr=kk?kk.userData.r*3.5/Math.min(1,asp*.9):30, dist=galDist+(zr-galDist)*e;
  camera.fov=40+9*Math.sin(Math.PI*e);camera.updateProjectionMatrix();
  const yw=Math.sin(tt*.12)*.07+uy, pt=Math.sin(tt*.09)*.03+up;
  camera.position.set(TG.x+Math.sin(yw)*Math.cos(pt)*dist,TG.y+Math.sin(pt)*dist,TG.z+Math.cos(yw)*Math.cos(pt)*dist);
  camera.lookAt(TG);
  bloom.strength=.5+.25*Math.sin(Math.PI*e);
  // 클러스터
  clusters.forEach((g,j)=>{
    const u=g.userData, sel=(j===fk), a=sel?1:1-.93*e, hov=(hoverK===j&&view===null)?1:0;
    u.h=(u.h||0)+(hov-(u.h||0))*.15;
    g.rotation.y+=dt*.00011*u.spin*(sel&&view!==null?.4:1); g.rotation.x+=dt*.00004*u.spin;
    g.scale.setScalar(1+.06*u.h);
    u.pm.opacity=a*(.9+.1*u.h); u.lm.opacity=a*(.3+.25*u.h); u.link.material.opacity=.22*a;
    const f=sel?clamp((e-.5)/.5,0,1):0;
    u.nodes.forEach((nd,i)=>{const pulse=1+.08*Math.sin(tt*2+i), s=f*pulse;nd.halo.scale.setScalar(s*3.6);nd.core.scale.setScalar(s*.95)});
  });
  // 라벨
  const rect={w:W,h:H};
  tags.forEach(t=>{
    const g=t.anchor; let show=1;
    const isCluster=t.el.classList.contains('click')&&clusters.includes(g)&&!t.el.querySelector('b')===false;
    V.copy(t.off); g.localToWorld?0:0;
    const wp=V.clone(); // 클러스터 로컬 → 월드
    if(clusters.includes(g)){ if(t.cls==='itm'){wp.applyMatrix4(g.matrixWorld)} else {wp.add(g.position)} }
    else wp.add(g.position||new THREE.Vector3());
    const j=clusters.indexOf(g), sel=(j===fk);
    if(t.cls==='click'&&t.el.querySelector('b')) show=clamp(1-e*2.4,0,1)*(1);           // 클러스터 이름
    else if(t.cls==='click') show=sel?clamp((e-.6)/.4,0,1):0;                            // 전체 상세
    else if(t.cls==='itm') show=sel?clamp((e-.65)/.35,0,1):0;
    else if(t.cls==='core') show=clamp(1-e*2,0,1);
    const pj=wp.clone().project(camera); const x=(pj.x+1)/2*W,y=(1-pj.y)/2*H;
    const vis=show>.02&&pj.z<1;
    t.el.style.display=vis?'':'none';
    if(vis){t.el.style.opacity=show.toFixed(2);t.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;t.el.classList.toggle('r',t.cls==='itm'&&x>W*.55);
      t.el.firstChild.style.pointerEvents=show>.7?'auto':'none';}
  });
  // 호버 판정
  if(!drag&&view===null){
    ray.setFromCamera(pointer,camera);
    const hits=ray.intersectObjects(clusters.map(g=>g.userData.hit),false);
    hoverK=hits.length?hits[0].object.userData.k:-1;
  } else if(view!==null) hoverK=-1;
  stage.classList.toggle('hov',hoverK>=0);
  composer.render();
}

  cur=k;
  sheet.style.transformOrigin=(ev&&ev.clientX>0)?`${ev.clientX}px ${ev.clientY}px`:'50% 50%';
  lastFocus=document.activeElement;
  renderSheet(hl);
  sheet.classList.remove('closing'); sheet.classList.add('open');
  document.body.classList.add('sheet-open'); document.body.style.overflow='hidden';
  sheet.scrollTop=0;
  if(hl!==null) setTimeout(()=>{const t=sin.querySelector('.item.hl'); if(t) t.scrollIntoView({behavior:'smooth',block:'center'})},450);
}
function renderSheet(hl){
  const m=MODS[cur], p=modPct(m);
  const prev=MODS[(cur-1+MODS.length)%MODS.length], next=MODS[(cur+1)%MODS.length];
  let h=`<div class="nav"><button class="back" id="bk">‹ 전체 보기</button><span style="color:var(--muted);font-size:13px">${cur+1} / ${MODS.length}</span></div>
  <div class="hero" style="background:linear-gradient(135deg,${m.color},color-mix(in srgb,${m.color} 55%,#000))">
    <div class="ic">${m.icon}</div><h2>${m.name}</h2><p>${m.sub}</p>
    <small>가동률 ${p}%</small><div class="bar"><i style="width:${p}%"></i></div></div>
  <div class="why">${m.why}</div>`;
  const groups=[...new Set(m.items.map(i=>i.g))];
  groups.forEach(gr=>{
    h+=`<div class="sec">${gr}</div><div class="items">`;
    m.items.forEach((it,i)=>{
      if(it.g!==gr)return;
      const s=getSt(m,i);
      h+=`<div class="item ${hl===i?'hl':''}"><div class="row"><h3>${it.n}</h3><span class="badge">${LV[it.lv]}</span></div>
        <p>${it.d}</p><p><span class="k">어떻게</span>${it.how}</p><p><span class="k">다음 할 일</span>${it.next}</p>
        ${it.cmd||it.link?`<div class="acts">${it.cmd?`<button class="act cp" data-cmd="${it.cmd.replace(/"/g,'&quot;')}">⌘ ${it.cmd}<em>복사</em></button>`:''}${it.link?`<a class="act" href="${it.link[1]}" target="_blank" rel="noopener">↗ ${it.link[0]}</a>`:''}</div>`:''}
        <button class="stbtn" data-i="${i}"><span class="dot" style="background:${ST[s].c}"></span>${ST[s].n}<span style="margin-left:auto;color:var(--muted);font-weight:400">눌러서 변경</span></button></div>`;
    });
    h+='</div>';
  });
  if(m.extra==='tax'){
    h+=`<div class="sec">세무 일정표 (일반 사업자 기준 예시)</div><table><tr><th>일정</th><th>시기</th></tr>${TAXD.map(t=>`<tr><td>${t.n}</td><td>${t.note}</td></tr>`).join('')}</table>
    <div class="note">⚠️ 과세유형(일반/간이/면세)·직원 유무·성실신고 여부에 따라 달라집니다. 신고·납부 전에는 홈택스 또는 세무사에게 반드시 확인하세요. 자동화는 "정리·알림·준비"까지만 하고, 제출은 사람이 승인하는 방식을 권장합니다.</div>`;
  }
  h+=`<div class="sec">연결 도구</div><div class="tools">${m.tools.map(t=>`<span>${t}</span>`).join('')}</div>
  <div class="mnav"><button id="pv"><small>이전</small>${prev.icon} ${prev.name}</button><button id="nx" style="text-align:right"><small>다음</small>${next.icon} ${next.name}</button></div>`;
  sin.innerHTML=h;
  sin.querySelector('#bk').onclick=closeSheet;
  sin.querySelector('#pv').onclick=()=>{cur=(cur-1+MODS.length)%MODS.length;renderSheet(null);sheet.scrollTop=0};
  sin.querySelector('#nx').onclick=()=>{cur=(cur+1)%MODS.length;renderSheet(null);sheet.scrollTop=0};
  sin.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{
    const t=b.dataset.cmd, done=()=>{const e=b.querySelector('em');e.textContent='복사됨 ✓';setTimeout(()=>e.textContent='복사',1500)};
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>prompt('복사해서 Claude에 붙여넣기',t));
  });
  sin.querySelectorAll('.stbtn').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, key=m.id+':'+i; state[key]=((state[key]||0)+1)%3; save();
    const y=sheet.scrollTop; renderSheet(i); sheet.scrollTop=y; refresh();
  });
}
function closeSheet(){
  sheet.classList.add('closing');
  setTimeout(()=>{sheet.classList.remove('open','closing');document.body.classList.remove('sheet-open');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()},260);
}
document.addEventListener('keydown',e=>{
  if(!sheet.classList.contains('open'))return;
  if(e.key==='Escape')closeSheet();
  if(e.key==='ArrowRight'){cur=(cur+1)%MODS.length;renderSheet(null);sheet.scrollTop=0}
  if(e.key==='ArrowLeft'){cur=(cur-1+MODS.length)%MODS.length;renderSheet(null);sheet.scrollTop=0}
});



function refresh(){ build(); drawGrid(); document.getElementById('pct').textContent='가동률 '+allPct()+'%' }
document.getElementById('btnReset').onclick=()=>{ if(confirm('모든 진행도를 초기화할까요?')){state={};save();refresh()} };
document.getElementById('btnExport').onclick=()=>{
  const txt=MODS.map(m=>`[${m.name}] ${modPct(m)}%\n`+m.items.map((it,i)=>`  ${ST[getSt(m,i)].n} ${it.n}`).join('\n')).join('\n\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('현황을 복사했습니다.')).catch(()=>prompt('복사해서 보관하세요',txt));
};
refresh();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
