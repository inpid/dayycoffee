<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>커맨드 센터</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#03020d; --card:rgba(14,10,42,.74); --text:#d7f3ff; --muted:#7fa6b8; --line:#3a2f6b; --accent:#a99bff;
  --glass:rgba(14,10,42,.7); --shadow:0 0 24px rgba(46,230,255,.12);
  --s0:#3b6174; --s1:#ffb020; --s2:#2dff9a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 50% 30%,#140a33 0%,#03020d 70%) fixed,var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header.top{max-width:1100px;margin:0 auto;padding:36px 24px 0;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:clamp(30px,5vw,52px);line-height:1.1;letter-spacing:-.03em;margin:8px 0 6px;font-weight:700}
h1 span{background:linear-gradient(90deg,#c1622d,#e9a23b 55%,#7c9a44);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:clamp(14px,2vw,17px);margin:0}
.toolbar{display:flex;gap:8px;justify-content:center;margin:16px 0 0;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:980px;padding:7px 16px;font-size:13px;color:var(--muted)}
.pill:hover,.pill.on{color:var(--text);border-color:var(--text)}

/* ---------- 3D stage ---------- */
#stage{position:relative;z-index:0;isolation:isolate;height:min(78vh,760px);min-height:520px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#stage.drag{cursor:grabbing}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 62%);pointer-events:none}
#lines{position:absolute;inset:0;pointer-events:none;overflow:visible}
#nodes{position:absolute;inset:0}
.n3{position:absolute;left:0;top:0;will-change:transform,opacity}
.core{position:relative;width:190px;height:190px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 32% 28%,#4a4a50,#111 62%,#000);color:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 0 0 2px #ffffff22;cursor:default}
.core .lg{max-width:120px;max-height:84px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.core .wm{font-weight:800;letter-spacing:.14em;font-size:17px;line-height:1.15}
.core .wm small{display:block;font-weight:600;font-size:15px;letter-spacing:.42em;color:#e9a23b}
.core .pc{margin-top:8px;font-size:12px;opacity:.75}
.core .ring{position:absolute;left:-9px;top:-9px;width:208px;height:208px;transform:rotate(-90deg)}

.main{cursor:pointer;color:#fff;border-radius:34px;padding:12px 20px 12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap;
  background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 18px 34px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 #ffffff55;transition:filter .2s,scale .2s;outline:none}
.main:hover,.main:focus-visible{scale:1.08;filter:brightness(1.1)}
.main .ic{font-size:24px}
.main .pct{font-size:11px;font-weight:700;background:#ffffff30;border-radius:980px;padding:2px 8px}
.leaf{cursor:pointer;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid var(--c);border-radius:20px;padding:7px 14px 7px 11px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);transition:scale .2s;outline:none}
.leaf:hover,.leaf:focus-visible{scale:1.1}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}

/* mobile cards */
.grid{display:none;margin:18px 16px 0;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mcard{background:var(--card);border-radius:22px;padding:18px;text-align:left;border:1px solid var(--line);box-shadow:var(--shadow)}
.mcard .ic{font-size:28px}.mcard b{display:block;font-size:17px;margin-top:4px}.mcard small{color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
@media (max-width:640px){ #stage{display:none} .grid{display:grid} }

.up{max-width:1100px;margin:26px auto 0;padding:0 24px}
.up h2{font-size:20px;letter-spacing:-.02em;margin:0 0 12px}
.uplist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.upc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.upc .d{font-size:28px;font-weight:700;letter-spacing:-.03em}.upc .d.hot{color:#ff3b30}
.upc span{color:var(--muted);font-size:13px}
footer{max-width:1100px;margin:40px auto;padding:0 24px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}

/* ---------- detail sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);overflow-y:auto;overscroll-behavior:contain}
#sheet.open{display:block;animation:sheetin .5s cubic-bezier(.2,.8,.2,1)}
#sheet.closing{animation:sheetout .28s ease forwards}
@keyframes sheetin{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes sheetout{to{opacity:0;transform:scale(.8)}}
.sheetin{max-width:980px;margin:0 auto;padding:18px 20px 80px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.back{border:0;background:var(--card);border-radius:980px;padding:9px 18px;font-size:14px;box-shadow:var(--shadow)}
.hero{border-radius:28px;padding:34px 30px;color:#fff}
.hero .ic{font-size:50px}.hero h2{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin:6px 0}
.hero p{margin:0;opacity:.93;font-size:16px;max-width:640px;line-height:1.55}
.hero .bar{background:#ffffff40;max-width:360px}.hero .bar i{background:#fff}
.hero small{display:block;margin-top:10px;opacity:.9}
.why{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-top:14px;font-size:14px;line-height:1.6;color:var(--muted)}
.why b{color:var(--text)}
.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:28px 0 12px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s,border-color .3s}
.item.hl{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.item h3{margin:0;font-size:18px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;background:var(--bg);color:var(--muted)}
.item p{margin:0;font-size:14px;color:var(--muted);line-height:1.55}
.item .k{font-size:12px;font-weight:700;color:var(--text);display:block;margin-bottom:2px}
.stbtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;text-align:left;display:flex;align-items:center;gap:8px;margin-top:auto}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:980px;padding:6px 13px;font-size:12.5px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.act em{font-style:normal;opacity:.7;font-weight:400}
.act:hover{background:var(--accent);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px}.tools span{background:var(--card);border:1px solid var(--line);border-radius:980px;padding:6px 14px;font-size:13px}
.mnav{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.mnav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;text-align:left}
.mnav button small{color:var(--muted);display:block}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:16px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.6;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
td,th{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}tr:last-child td{border:0}th{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* ===== HUD skin ===== */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(#a99bff0d 1px,transparent 1px),linear-gradient(90deg,#a99bff0d 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,transparent 0 3px,#00000022 3px 4px);opacity:.5}
header.top{position:relative;z-index:1;padding-top:26px}
.eyebrow{color:var(--accent);text-shadow:0 0 12px var(--accent)}
h1{font-size:clamp(22px,3.4vw,36px);letter-spacing:.02em;font-weight:600}
h1 span{background:linear-gradient(90deg,#a99bff,#b8f4ff 60%,#2dff9a);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:#140a3399;border-color:#3a2f6b;color:var(--muted);backdrop-filter:blur(6px)}
.pill:hover,.pill.on{color:#fff;border-color:var(--accent);box-shadow:0 0 12px #a99bff55}
.console{position:relative;z-index:1}
#stage{height:min(80vh,800px)}
#lines{filter:drop-shadow(0 0 4px #a99bff99)}
.core{background:radial-gradient(circle at 50% 40%,#0b3a52 0%,#041a29 65%,#020b12);box-shadow:0 0 50px #a99bff66,0 0 120px #a99bff22,inset 0 0 40px #a99bff33;border:1.5px solid #a99bff99}
.core::before,.core::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.core::before{inset:-22px;border:1.5px dashed #a99bff77;animation:spin 22s linear infinite}
.core::after{inset:-40px;border:1px solid #a99bff33;border-top-color:#a99bff;border-bottom-color:#a99bff;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core .lg{max-width:138px;max-height:60px;filter:drop-shadow(0 0 8px #a99bffaa)}
.core .wm{text-shadow:0 0 10px #a99bff}
.core .ring{display:none}
.core .pc{color:#d6ccff;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;margin-top:10px}
.main{border-radius:6px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 38%,#031724),#031724 85%);border:1px solid var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 22%,transparent);text-shadow:0 0 8px #000;letter-spacing:.02em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.main .pct{background:color-mix(in srgb,var(--c) 30%,#000);color:#fff;border-radius:3px;font-family:ui-monospace,Menlo,monospace}
.leaf{border-radius:4px;background:#0d0a2ccc;border:1px solid color-mix(in srgb,var(--c) 80%,#000);box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent);color:#d7f3ff;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.dot{box-shadow:0 0 0 2px #ffffff14}
.hint{color:#4f7e92;letter-spacing:.1em}
/* side HUD panels */
.hud{position:absolute;top:8px;width:250px;z-index:3;display:flex;flex-direction:column;gap:12px}
.hud.l{left:20px}.hud.r{right:20px}
.panel{background:var(--card);border:1px solid #3a2f6b;box-shadow:var(--shadow);padding:14px 14px 12px;position:relative;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;font-weight:700}
.brow{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 0;color:var(--text)}
.brow:hover b{color:#fff;text-shadow:0 0 8px var(--accent)}
.brow div{display:flex;justify-content:space-between;font-size:12.5px}
.brow b{font-weight:600}.brow span{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
.brow .bar{height:4px;margin-top:5px;border-radius:0;background:#241a52}.brow .bar i{border-radius:0;box-shadow:0 0 8px currentColor}
.clock{font-family:ui-monospace,Menlo,monospace;font-size:30px;letter-spacing:.04em;color:#fff;text-shadow:0 0 14px var(--accent)}
.cdate{color:var(--muted);font-size:12px;margin-top:2px}
.dd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid #3a2f6b55;font-size:12px}
.dd:first-of-type{border-top:0}
.dd em{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:16px;color:#d6ccff}.dd em.hot{color:#ff5a6e;text-shadow:0 0 8px #ff5a6e}
.dd small{display:block;color:var(--muted);font-size:11px}
@media (max-width:1180px){.hud{position:static;width:auto;margin:12px 16px 0}.console{display:flex;flex-direction:column}.hud.l{order:2}.hud.r{order:3}#stage{order:1}}
@media (max-width:640px){.hud.l{display:none}}
.item,.why,table,.mnav button,.tools span,.upc,.mcard{border-color:#3a2f6b;box-shadow:var(--shadow)}
.hero{box-shadow:0 0 40px color-mix(in srgb,var(--accent) 25%,transparent);border:1px solid #a99bff55;border-radius:10px}
.item,.why,.mcard{border-radius:10px}
.back{background:var(--card);color:var(--text);border:1px solid #3a2f6b}
.stbtn{background:#0d0a2c;border-color:#3a2f6b}
.act{border-color:var(--accent);color:var(--accent)}.act:hover{background:var(--accent);color:#012}
.item.hl{border-color:var(--accent);box-shadow:0 0 22px #a99bff66}

/* ===== Space skin ===== */
body{background:#03020d}
body::before{background:radial-gradient(55% 50% at 12% 18%,#8a2fb066,transparent 70%),radial-gradient(55% 55% at 88% 28%,#1f9aa555,transparent 70%),radial-gradient(70% 55% at 45% 100%,#18c0a044,transparent 70%),radial-gradient(45% 40% at 85% 88%,#c0306e44,transparent 70%);background-size:140% 140%;mask-image:none;-webkit-mask-image:none;animation:neb 90s ease-in-out infinite alternate}
@keyframes neb{from{background-position:0% 0%}to{background-position:100% 100%}}
body::after{display:none}
#space,#warp{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#space{z-index:0}
#warp{z-index:70;opacity:0;transition:opacity .5s}
#lines{filter:none}
.star{position:relative;width:var(--z);height:var(--z);cursor:pointer;outline:none}
.star .orb{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--z)*.5);font-style:normal;
  background:radial-gradient(circle at 40% 35%,#fff 0%,#fff 12%,var(--c) 45%,color-mix(in srgb,var(--c) 40%,transparent) 72%);
  box-shadow:0 0 16px 3px color-mix(in srgb,var(--c) 75%,transparent),0 0 54px 12px color-mix(in srgb,var(--c) 32%,transparent);animation:twk 5s ease-in-out infinite;transition:transform .3s}
.star:hover .orb,.star:focus-visible .orb{transform:scale(1.3)}
@keyframes twk{50%{filter:brightness(1.4)}}
.star .lbl{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:15px;font-weight:600;color:#fff;text-shadow:0 0 8px #000,0 0 16px var(--c)}
.star .sub{position:absolute;top:calc(100% + 34px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#d6ccff;font-family:ui-monospace,Menlo,monospace}
.star.nolbl .sub{top:calc(100% + 12px)}
.star.sun{cursor:default}
.dust{width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #cfe4ff}
.pill#btnBack{border-color:#a99bff;color:#fff}

/* ===== Cinematic layer ===== */
body::before{display:none}
#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
#film{position:fixed;inset:0;z-index:55;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#000000aa 100%);}
#film::after{content:"";position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.console{position:relative;z-index:1}
#stage{background:none;cursor:grab;overflow:hidden}
#stage::before{display:none}
#tags{position:absolute;inset:0;transition:opacity .4s}
#stage.warping #tags{opacity:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}
.tag .hit{pointer-events:auto;position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;background:transparent;border:0;cursor:pointer;outline:none;padding:0}
.tag.sun:not(.click) .hit{pointer-events:none}
.tag .hit::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--c) 70%,#fff);opacity:0;transform:scale(.55);transition:opacity .3s,transform .3s}
.tag:hover .hit::before,.tag .hit:focus-visible::before{opacity:1;transform:scale(1);animation:spin 9s linear infinite}
@keyframes spin{to{rotate:360deg}}
.tag .ln{position:absolute;left:34px;top:0;width:30px;height:1px;background:linear-gradient(90deg,var(--c),transparent)}
.tag .txt{position:absolute;left:70px;top:-23px;white-space:nowrap;pointer-events:none}
.tag.r .ln{left:auto;right:34px;background:linear-gradient(270deg,var(--c),transparent)}
.tag.r .txt{left:auto;right:70px;text-align:right}
.tag.sun .ln{display:none}
.tag.sun .txt{left:50%;top:40px;transform:translateX(-50%);text-align:center}
.tag .txt small{display:block;font:600 10px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:color-mix(in srgb,var(--c) 70%,#fff);text-shadow:0 0 10px var(--c);text-transform:uppercase}
.tag .txt b{display:block;font-size:15px;font-weight:600;color:#fff;letter-spacing:.01em;text-shadow:0 0 12px #000,0 0 3px #000}
.tag .txt i{display:block;font-style:normal;font-size:11px;color:#b3acdc;margin-top:1px}
@media (min-width:1181px){
  body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  .console{flex:1;min-height:0}
  #stage{position:absolute;inset:0;height:auto;min-height:0}
}
@media (max-width:1180px){#stage{height:72vh;min-height:480px}}
body.warping .hud,body.warping header.top{opacity:0}
.hud,header.top{transition:opacity .5s}
body.no3d #stage{display:none}
body.no3d .grid{display:grid}
header.top{pointer-events:none}header.top .toolbar{pointer-events:auto}
.hint{bottom:14px}
</style>
</head>

function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);return t}
let T_GLOW,T_SPIKE,T_STREAK;
function makeTextures(){

    [Math.PI/4,-Math.PI/4].forEach(a=>{g.save();g.rotate(a);const L=g.createLinearGradient(-w/4,0,w/4,0);L.addColorStop(0,'rgba(255,255,255,0)');L.addColorStop(.5,'rgba(255,255,255,.5)');L.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=L;g.fillRect(-w/4,-1,w/2,2);g.restore()})});
  T_STREAK=tex(512,64,(g,w,h)=>{g.save();g.translate(w/2,h/2);g.scale(1,h/w*1.0);const r=g.createRadialGradient(0,0,0,0,0,w/2);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(.25,'rgba(255,255,255,.25)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(-w/2,-w/2,w,w);g.restore()});
}
function sprite(map,color,size,op,sy){const m=new THREE.SpriteMaterial({map,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false});const sp=new THREE.Sprite(m);sp.scale.set(size,size*(sy||1),1);return sp}

/* ---------- 배경: 성운 + 별 ---------- */
const NOISE_GLSL=`
float h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}`;
function addBackground(){
  neb=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,depthTest:false,uniforms:{uTime:{value:0}},
    vertexShader:'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vD;uniform float uTime;'+NOISE_GLSL+`
    void main(){
      vec3 d=normalize(vD); float t=uTime*.01;
      vec3 q=d*1.5+vec3(0.,0.,t);
      float a=fbm(q); float b=fbm(q*2.1+a*2.3+vec3(5.,1.,t*2.)); float c=fbm(q*3.2+b*1.7+vec3(2.,8.,0.));
      vec3 col=vec3(.004,.004,.02);
      vec3 cA=mix(vec3(.62,.05,.55),vec3(.10,.12,.62),b);
      vec3 cB=mix(vec3(.0,.62,.55),vec3(.02,.22,.52),c);
      col+=cA*smoothstep(.3,.7,a)*pow(b,1.1)*1.9;
      col+=cB*smoothstep(.36,.78,fbm(q*1.15+vec3(9.,3.,t)))*pow(c,1.05)*1.7;
      col+=vec3(1.,.5,.62)*pow(smoothstep(.6,.92,b*c*1.9),2.)*.8;
      col+=vec3(.45,.9,1.)*pow(smoothstep(.72,.95,c),3.)*.3;
      col*=mix(.32,1.,smoothstep(.22,.66,fbm(q*4.+7.)));
      col*=.7+.3*smoothstep(-1.,1.,d.y);
      gl_FragColor=vec4(col,1.);
    }`}));
  neb.renderOrder=-10; neb.frustumCulled=false; scene.add(neb);
  sky=new THREE.Group(); scene.add(sky);
  sky.add(starLayer(6500,700,880,1.1,3.2,0)); sky.add(starLayer(260,700,880,3,8,0));
}
function starLayer(n,r0,r1,s0,s1,near){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),siz=new Float32Array(n),ph=new Float32Array(n);
  const pal=[[.82,.9,1],[.82,.9,1],[1,.88,.66],[1,.62,.82],[.62,1,1],[.8,.7,1]];
  for(let i=0;i<n;i++){
    const u=rnd(-1,1),t=rnd(0,6.2832),q=Math.sqrt(1-u*u),r=rnd(r0,r1);
    pos.set([r*q*Math.cos(t),r*u,r*q*Math.sin(t)],i*3);
    const c=pal[Math.floor(Math.random()*pal.length)],br=.45+Math.random()*.55;
    col.set([c[0]*br,c[1]*br,c[2]*br],i*3);
    siz[i]=s0+Math.pow(Math.random(),4)*(s1-s0); ph[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('size',new THREE.BufferAttribute(siz,1));g.setAttribute('phase',new THREE.BufferAttribute(ph,1));
  const m=starMat(near); const p=new THREE.Points(g,m); p.frustumCulled=false; return p;
}
function starMat(near){
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uPx:{value:1},uNear:{value:near?1:0},uOp:{value:1}},
    vertexShader:`attribute float size;attribute float phase;attribute vec3 color;varying vec3 vC;varying float vA;uniform float uTime,uPx,uNear;
      void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;
      float sc=mix(1.,70./max(1.,-mv.z),uNear);gl_PointSize=clamp(size*uPx*sc,1.,64.);
      vC=color;vA=.62+.38*sin(uTime*(.6+phase*2.)+phase*40.);}`,
    fragmentShader:`varying vec3 vC;varying float vA;uniform float uOp;void main(){float d=length(gl_PointCoord-.5);float core=exp(-d*d*70.);float halo=exp(-d*9.)*.3;gl_FragColor=vec4(vC*(core+halo)*vA*uOp*1.6,1.);}`});
  starMats.push(m); return m;
}

/* ---------- 별(천체) ---------- */
function makeStar(color,size,o){
  o=o||{}; const g=new THREE.Group(), col=new THREE.Color(color), white=new THREE.Color(1,1,1);
  const halo=sprite(T_GLOW,col,size*10,.85), streak=sprite(T_STREAK,col.clone().lerp(white,.35),size*34,.55,.09), spike=sprite(T_SPIKE,col.clone().lerp(white,.5),size*15,.8), core=sprite(T_GLOW,0xffffff,size*1.5,1);
  g.add(halo,streak,spike,core);
  const rings=[];
  for(let i=0;i<(o.rings===undefined?2:o.rings);i++){
    const R=size*(2.7+i*.9);
    const ring=new THREE.Mesh(new THREE.RingGeometry(R,R+size*.05,96,1,0,i?4.4:6.2832),new THREE.MeshBasicMaterial({color:col.clone().lerp(white,.3),transparent:true,opacity:.55-i*.15,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
    ring.rotation.set(rnd(.9,1.3),rnd(-.5,.5),rnd(0,3));ring.userData.sp=(i?-1:1)*rnd(.15,.35);g.add(ring);rings.push(ring);
  }
  if(o.disc){
    const n=3200,pos=new Float32Array(n*3),cl=new Float32Array(n*3),sz=new Float32Array(n),ph=new Float32Array(n);
    for(let i=0;i<n;i++){const r=size*(2.2+Math.pow(Math.random(),1.5)*5.4),t=rnd(0,6.2832),f=(r/size-2.2)/5.4;
      pos.set([r*Math.cos(t),(Math.random()-.5)*size*.5*(1-f),r*Math.sin(t)],i*3);
      const c=new THREE.Color().setHSL(.08+f*.58,.9,.55+.15*(1-f)).multiplyScalar(.6+.4*Math.random()); cl.set([c.r,c.g,c.b],i*3); sz[i]=1.4+Math.pow(Math.random(),3)*5;ph[i]=Math.random()}
    const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.BufferAttribute(pos,3));gg.setAttribute('color',new THREE.BufferAttribute(cl,3));gg.setAttribute('size',new THREE.BufferAttribute(sz,1));gg.setAttribute('phase',new THREE.BufferAttribute(ph,1));
    const pts=new THREE.Points(gg,starMat(true));pts.frustumCulled=false;pts.rotation.x=.38;g.add(pts);discs.push(pts);
  }
  g.userData={halo,spike,streak,core,rings,size,hover:0,hv:0,ph:Math.random()*6.28};
  return g;
}
function addLink(a,b,color){
  const c=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5); c.y+=5+a.distanceTo(b)*.12;
  const curve=new THREE.QuadraticBezierCurve3(a.clone(),c,b.clone());
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),new THREE.LineBasicMaterial({color,transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
  world.add(line);
  for(let i=0;i<3;i++){const sp=sprite(T_GLOW,new THREE.Color(color).lerp(new THREE.Color(1,1,1),.5),1.7,.95);world.add(sp);flows.push({curve,sp,t:Math.random(),v:rnd(.05,.1)})}
}
function addHudRings(){
  [[34,.2],[52,.1]].forEach(([r,o])=>{
    const pts=[];for(let i=0;i<=160;i++){const t=i/160*6.2832;pts.push(new THREE.Vector3(Math.cos(t)*r,0,Math.sin(t)*r))}
    world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x9a8cff,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false})));
    const tp=[];for(let i=0;i<72;i++){const t=i/72*6.2832;tp.push(Math.cos(t)*r,0,Math.sin(t)*r)}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(tp,3));
    world.add(new THREE.Points(g,new THREE.PointsMaterial({size:.55,map:T_GLOW,color:0xb4a8ff,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false})));
  });
}

/* ---------- 라벨(HTML) ---------- */
function mkTag(star,color,code,title,sub,cls,fn){
  const el=document.createElement('div'); el.className='tag '+(cls||''); el.style.setProperty('--c',color);
  el.innerHTML=`<button class="hit" aria-label="${title||code}"></button><div class="ln"></div><div class="txt"><small>${code}</small>${title?`<b>${title}</b>`:''}${sub?`<i>${sub}</i>`:''}</div>`;
  tagsEl.appendChild(el);
  const hit=el.querySelector('.hit');
  hit.addEventListener('mouseenter',()=>star.userData.hover=1); hit.addEventListener('mouseleave',()=>star.userData.hover=0);
  hit.addEventListener('focus',()=>star.userData.hover=1); hit.addEventListener('blur',()=>star.userData.hover=0);
  if(fn){ hit.addEventListener('click',e=>{ if(moved||busy)return; fn(e) }); } 
  entries.push({star,el});
}

/* ---------- 씬 구성 ---------- */
const YG=[-6,5,-2,7,-5];
function build(){
  if(!HAS3D)return;
  if(world) scene.remove(world);
  world=new THREE.Group(); scene.add(world); entries=[]; flows=[]; discs=[]; tagsEl.innerHTML='';
  addHudRings();
  // 근거리 먼지
  const dust=starLayer(520,10,95,3,7,1); world.add(dust);
  if(view===null) buildGalaxy(); else buildModule(view);
  updateUI();
}
function buildGalaxy(){
  const sun=makeStar('#ffcf8a',3.0,{rings:3,disc:true}); world.add(sun);
  mkTag(sun,'#ffcf8a','CORE','','가동률 '+allPct()+'%','sun');
  const n=MODS.length;
  MODS.forEach((m,k)=>{
    const a=k*2*Math.PI/n-Math.PI/2, p=new THREE.Vector3(Math.cos(a)*34,YG[k%YG.length],Math.sin(a)*34);
    const st=makeStar(m.color,1.7,{rings:2}); st.position.copy(p); world.add(st);
    addLink(new THREE.Vector3(0,0,0),p,m.color);
    mkTag(st,m.color,'SEC-0'+(k+1)+' · '+modPct(m)+'%',m.name,m.items.length+'개 항목','',e=>jumpTo(k,e));
  });
}
function buildModule(k){
  const m=MODS[k], n=m.items.length;
  const sun=makeStar(m.color,3.0,{rings:3,disc:true}); world.add(sun);
  mkTag(sun,m.color,'SEC-0'+(k+1)+' · 전체 상세 ›',m.name,'가동률 '+modPct(m)+'%','sun click',e=>openMod(k,null,e));
  m.items.forEach((it,i)=>{
    const a=i*2*Math.PI/n-Math.PI/2, rr=26+(i%2)*5, p=new THREE.Vector3(Math.cos(a)*rr,(i%2?1:-1)*(3+(i%3)*2.2),Math.sin(a)*rr);
    const st=makeStar(m.color,1.15,{rings:1}); st.position.copy(p); world.add(st);
    addLink(new THREE.Vector3(0,0,0),p,m.color);
    mkTag(st,m.color,'ITM-0'+(i+1)+' · '+['💡 구상','🔧 구축중','✅ 운영중'][getSt(m,i)],it.s,LV[it.lv],'',e=>openMod(k,i,e));
  });
}

/* ---------- 워프 터널 ---------- */
function addTunnel(){
  tunnel=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,uniforms:{uT:{value:0},uOp:{value:0},uFlash:{value:0},uAsp:{value:1},uC:{value:new THREE.Vector2(.5,.5)}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader:'varying vec2 vUv;uniform float uT,uOp,uFlash,uAsp;uniform vec2 uC;'+NOISE_GLSL+`
    void main(){
      vec2 p=(vUv-uC)*vec2(uAsp,1.); float r=length(p); float a=atan(p.y,p.x);
      float depth=1./max(r,.002); float t=uT;
      a+=depth*.18;
      float n=n3(vec3(cos(a)*30.,sin(a)*30.,depth*.12-t));
      float n2=n3(vec3(cos(a)*80.,sin(a)*80.,depth*.3-t*1.9));
      float n4=n3(vec3(cos(a)*12.,sin(a)*12.,depth*.08-t*.6));
      float streak=pow(smoothstep(.58,.95,n),3.)*1.0+pow(smoothstep(.66,1.,n2),3.)*.9+pow(smoothstep(.55,.95,n4),2.)*.35;
      float bands=pow(.5+.5*sin(depth*2.2-t*4.),14.)*.35;
      vec3 pal=.5+.5*cos(6.2832*(vec3(.0,.33,.67)*.8+depth*.03+t*.04+n4*.4+vec3(.55,.62,.7)));
      vec3 col=pal*(streak+bands)*.85;
      col*=smoothstep(.015,.2,r);
      col+=vec3(.7,.85,1.)*exp(-r*18.)*1.3;
      col+=vec3(.45,.3,1.)*exp(-r*2.2)*.12;
      col=mix(col,vec3(1.),uFlash);
      gl_FragColor=vec4(col,max(uOp,uFlash));
    }`}));
  tunnel.renderOrder=1000; tunnel.frustumCulled=false; tunnel.visible=false; scene.add(tunnel);
}
let warp=null;
function startWarp(ev,mid){
  if(busy||!HAS3D){mid();return}
  busy=true; stage.classList.add('warping'); document.body.classList.add('warping');
  const cx=ev&&ev.clientX>0?ev.clientX:innerWidth/2, cy=ev&&ev.clientX>0?ev.clientY:innerHeight/2;
  tunnel.material.uniforms.uC.value.set(cx/innerWidth,1-cy/innerHeight);
  tunnel.visible=true; warp={t0:performance.now(),dur:2600,mid,swapped:false,T:0};
}
function jumpTo(k,ev){ startWarp(ev,()=>{view=k;yaw=HOME.yaw;pitch=HOME.pitch;yawV=0;build()}) }
function backHome(ev){ if(view===null)return; startWarp(ev,()=>{view=null;yaw=HOME.yaw;pitch=HOME.pitch;yawV=0;build()}) }

/* ---------- 초기화 ---------- */
function init3D(){
  renderer=new THREE.WebGLRenderer({canvas:glc,antialias:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75)); renderer.setSize(innerWidth,innerHeight,false);
  scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,2200);
  makeTextures();
  composer=new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.7,.7,.22); composer.addPass(bloom);
  addBackground(); addTunnel();
  onResize();
}
function onResize(){
  if(!HAS3D)return;
  renderer.setSize(innerWidth,innerHeight,false); composer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  const px=renderer.getPixelRatio(); starMats.forEach(m=>m.uniforms.uPx.value=px);
  tunnel.material.uniforms.uAsp.value=innerWidth/innerHeight;
}

/* ---------- 프레임 루프 ---------- */
let last=performance.now(), clk=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!HAS3D)return;
  const dt=Math.min(50,now-last); last=now; clk+=dt/1000;
  const sheetOpen=document.body.classList.contains('sheet-open');
  if(sheetOpen&&!warp){ return; }
  const rc=stage.getBoundingClientRect(), W=innerWidth, H=innerHeight;
  // 카메라
  if(!drag&&!warp){ yaw+=yawV; yawV*=.94; if(auto&&Math.abs(yawV)<.0004) yaw+=dt*.00004; }
  const Rpx=Math.max(120,Math.min(rc.width/2*.9,rc.height/2*.92));
  const dist0=44*H/(2*Math.tan(22.5*Math.PI/180)*Rpx)/zoom;
  let dist=dist0, fov=45, bl=.7;
  if(warp){
    warp.T+=dt/1000*(.6+ease(clamp((now-warp.t0)/warp.dur,0,1))*7);
    const p=clamp((now-warp.t0)/warp.dur,0,1), u=tunnel.material.uniforms;
    u.uT.value=warp.T;
    if(p<.58){ const e=ease(p/.58); u.uOp.value=clamp(e*1.6,0,1); u.uFlash.value=0; fov=45+70*e; bl=.7+.7*e; dist=dist0*(1-.35*e); }
    else if(p<.72){ const e=(p-.58)/.14; u.uOp.value=1; u.uFlash.value=ease(e); fov=115; bl=1.4; dist=dist0*.65; }
    else { if(!warp.swapped){warp.swapped=true;warp.mid();}
      const e=ease((p-.72)/.28); u.uOp.value=1-e; u.uFlash.value=1-clamp(e*1.4,0,1); fov=115-70*e; bl=1.4-.7*e; dist=dist0*(.65+.35*e); }
    if(p>=1){ tunnel.visible=false; u.uOp.value=0;u.uFlash.value=0; warp=null; busy=false; stage.classList.remove('warping'); document.body.classList.remove('warping'); fov=45;bl=.7;dist=dist0; }
  }
  camera.fov=fov; camera.updateProjectionMatrix();
  const py=pitch+Math.sin(clk*.2)*.012;
  camera.position.set(Math.sin(yaw)*Math.cos(py)*dist,Math.sin(py)*dist,Math.cos(yaw)*Math.cos(py)*dist);
  camera.lookAt(0,0,0);
  const cxs=rc.left+rc.width/2, cys=rc.top+rc.height/2;
  camera.setViewOffset(W,H,-(cxs-W/2),-(cys-H/2),W,H);
  bloom.strength=bl;
  neb.position.copy(camera.position); sky.position.copy(camera.position);
  neb.material.uniforms.uTime.value=clk;
  starMats.forEach(m=>m.uniforms.uTime.value=clk);
  // 천체 애니메이션
  entries.forEach(e=>{
    const d=e.star.userData; d.hv+=(d.hover-d.hv)*.12;
    const sc=1+.38*d.hv; e.star.scale.setScalar(sc);
    d.spike.material.rotation+=dt*.00012*(1+d.hv*3);
    d.halo.material.opacity=.78+.14*Math.sin(clk*1.3+d.ph)+.1*d.hv;
    d.rings.forEach(r=>r.rotation.z+=dt*.001*r.userData.sp);
  });
  discs.forEach(p=>p.rotation.y+=dt*.00018);
  flows.forEach(f=>{f.t+=f.v*dt/1000;if(f.t>1)f.t-=1;f.sp.position.copy(f.curve.getPoint(f.t));f.sp.material.opacity=Math.sin(f.t*Math.PI)*.95});
  // 라벨 위치
  const v=new THREE.Vector3();
  entries.forEach(e=>{
    e.star.getWorldPosition(v); const dd=camera.position.distanceTo(v); v.project(camera);
    const x=(v.x+1)/2*W-rc.left, y=(1-v.y)/2*H-rc.top;
    const vis=v.z<1&&x>-60&&x<rc.width+60&&y>-60&&y<rc.height+60;
    const k=clamp(1-(dd-dist0*.7)/(dist0*.9),0,1), sc=.8+.25*k;
    e.el.style.display=vis?'':'none';
    if(vis){ e.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(3)})`; e.el.style.opacity=(.5+.5*k).toFixed(2); e.el.style.zIndex=Math.round(100*k); e.el.classList.toggle('r',x>rc.width*.58&&!e.el.classList.contains('sun')); }
  });
  composer.render();
}
function updateUI(){
  document.getElementById('btnBack').style.display=view===null?'none':'';
  document.getElementById('lead').textContent=view===null?'별을 눌러 그 안으로 점프하세요.':`${MODS[view].name} — 별을 누르면 상세가 열립니다.`;
  document.getElementById('hint').textContent=view===null?'드래그로 회전 · 스크롤로 확대 · 별을 눌러 점프':'가운데 별 = 전체 상세 · 주변 별 = 항목 상세';
}

/* ---------- 입력 ---------- */
stage.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,yaw,pitch,lx:e.clientX}; moved=false; yawV=0; });
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!moved&&Math.hypot(dx,dy)>6){moved=true;stage.style.cursor='grabbing'}
  if(moved){ const ny=drag.yaw-dx*.005; yawV=(ny-yaw)*.5; yaw=ny; pitch=clamp(drag.pitch+dy*.004,-.15,1.15); }
});
window.addEventListener('pointerup',()=>{ drag=null; stage.style.cursor=''; setTimeout(()=>moved=false,0) });
stage.addEventListener('wheel',e=>{ e.preventDefault(); zoom=clamp(zoom*(e.deltaY>0?.93:1.07),.6,1.8) },{passive:false});
window.addEventListener('resize',onResize);
document.getElementById('btnRot').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto)};
document.getElementById('btnHome').onclick=()=>{yaw=HOME.yaw;pitch=HOME.pitch;yawV=0;zoom=1};
document.getElementById('btnBack').onclick=e=>backHome(e);
function wire(){}
if(HAS3D){ init3D(); requestAnimationFrame(frame); }

/* ---------- 모바일 카드 ---------- */
function drawGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  MODS.forEach((m,k)=>{
    const b=document.createElement('button'); b.className='mcard';
    b.innerHTML=`<span class="ic">${m.icon}</span><b>${m.name}</b><small>${m.items.length}개 항목 · 가동 ${modPct(m)}%</small><div class="bar"><i style="width:${modPct(m)}%;background:${m.color}"></i></div>`;
    b.onclick=e=>openMod(k,null,e); g.appendChild(b);
  });
}

/* ---------- 세무 일정 ---------- */
const TAXD=[
 {n:'원천세 신고·납부',m:0,d:10,note:'매월 10일 (직원·프리랜서 지급이 있을 때)'},
 {n:'부가세 확정신고',m:1,d:25,note:'1월 25일(전년 하반기)'},
 {n:'면세사업자 사업장현황신고',m:2,d:10,note:'2월 10일 (해당 시)'},
 {n:'종합소득세 신고',m:5,d:31,note:'5월 31일'},
 {n:'부가세 확정신고',m:7,d:25,note:'7월 25일(상반기)'},
];
function upcoming(){
  const now=new Date(); now.setHours(0,0,0,0); const out=[];
  TAXD.forEach(t=>{ for(let y=now.getFullYear();y<=now.getFullYear()+1;y++){
    (t.m===0?[...Array(12).keys()]:[t.m-1]).forEach(mo=>{const dt=new Date(y,mo,t.d); if(dt>=now) out.push({...t,dt})}); }});
  out.sort((a,b)=>a.dt-b.dt);
  const u=new Set(); return out.filter(o=>!u.has(o.n)&&u.add(o.n)).slice(0,4).map(o=>({...o,left:Math.round((o.dt-now)/864e5)}));
}
function drawUp(){
  document.getElementById('uplist').innerHTML=upcoming().map(o=>`<div class="dd"><div>${o.n}<small>${o.dt.getMonth()+1}/${o.dt.getDate()}</small></div><em class="${o.left<=7?'hot':''}">D-${o.left}</em></div>`).join('');
  const t=()=>{const d=new Date();document.getElementById('clock').textContent=d.toTimeString().slice(0,8);document.getElementById('cdate').textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})};
  t(); setInterval(t,1000);
}
function drawLeft(){
  const el=document.getElementById('lpanel');
  el.innerHTML=`<div class="brow" style="padding-top:0"><div><b>전체 가동률</b><span>${allPct()}%</span></div><div class="bar"><i style="width:${allPct()}%;background:#2dff9a;color:#2dff9a"></i></div></div>`+
    MODS.map((m,k)=>`<button class="brow" data-k="${k}"><div><b>${m.icon} ${m.name}</b><span>${modPct(m)}%</span></div><div class="bar"><i style="width:${Math.max(3,modPct(m))}%;background:${m.color};color:${m.color}"></i></div></button>`).join('');
  el.querySelectorAll('.brow[data-k]').forEach(b=>b.onclick=e=>jumpTo(+b.dataset.k,e));
}

/* ---------- 상세 시트 ---------- */
const sheet=document.getElementById('sheet'), sin=document.getElementById('sheetin');
let cur=0, lastFocus=null;
function openMod(k,hl,ev){
  cur=k;
  sheet.style.transformOrigin=(ev&&ev.clientX>0)?`${ev.clientX}px ${ev.clientY}px`:'50% 50%';
  lastFocus=document.activeElement;
  renderSheet(hl);
  sheet.classList.remove('closing'); sheet.classList.add('open');
  document.body.classList.add('sheet-open'); document.body.style.overflow='hidden';
  sheet.scrollTop=0;
  if(hl!==null) setTimeout(()=>{const t=sin.querySelector('.item.hl'); if(t) t.scrollIntoView({behavior:'smooth',block:'center'})},450);
}
function renderSheet(hl){
  const m=MODS[cur], p=modPct(m);
  const prev=MODS[(cur-1+MODS.length)%MODS.length], next=MODS[(cur+1)%MODS.length];
  let h=`<div class="nav"><button class="back" id="bk">‹ 전체 보기</button><span style="color:var(--muted);font-size:13px">${cur+1} / ${MODS.length}</span></div>
  <div class="hero" style="background:linear-gradient(135deg,${m.color},color-mix(in srgb,${m.color} 55%,#000))">
    <div class="ic">${m.icon}</div><h2>${m.name}</h2><p>${m.sub}</p>
    <small>가동률 ${p}%</small><div class="bar"><i style="width:${p}%"></i></div></div>
  <div class="why">${m.why}</div>`;
  const groups=[...new Set(m.items.map(i=>i.g))];
  groups.forEach(gr=>{
    h+=`<div class="sec">${gr}</div><div class="items">`;
    m.items.forEach((it,i)=>{
      if(it.g!==gr)return;
      const s=getSt(m,i);
      h+=`<div class="item ${hl===i?'hl':''}"><div class="row"><h3>${it.n}</h3><span class="badge">${LV[it.lv]}</span></div>
        <p>${it.d}</p><p><span class="k">어떻게</span>${it.how}</p><p><span class="k">다음 할 일</span>${it.next}</p>
        ${it.cmd||it.link?`<div class="acts">${it.cmd?`<button class="act cp" data-cmd="${it.cmd.replace(/"/g,'&quot;')}">⌘ ${it.cmd}<em>복사</em></button>`:''}${it.link?`<a class="act" href="${it.link[1]}" target="_blank" rel="noopener">↗ ${it.link[0]}</a>`:''}</div>`:''}
        <button class="stbtn" data-i="${i}"><span class="dot" style="background:${ST[s].c}"></span>${ST[s].n}<span style="margin-left:auto;color:var(--muted);font-weight:400">눌러서 변경</span></button></div>`;
    });
    h+='</div>';
  });
  if(m.extra==='tax'){
    h+=`<div class="sec">세무 일정표 (일반 사업자 기준 예시)</div><table><tr><th>일정</th><th>시기</th></tr>${TAXD.map(t=>`<tr><td>${t.n}</td><td>${t.note}</td></tr>`).join('')}</table>
    <div class="note">⚠️ 과세유형(일반/간이/면세)·직원 유무·성실신고 여부에 따라 달라집니다. 신고·납부 전에는 홈택스 또는 세무사에게 반드시 확인하세요. 자동화는 "정리·알림·준비"까지만 하고, 제출은 사람이 승인하는 방식을 권장합니다.</div>`;
  }
  h+=`<div class="sec">연결 도구</div><div class="tools">${m.tools.map(t=>`<span>${t}</span>`).join('')}</div>
  <div class="mnav"><button id="pv"><small>이전</small>${prev.icon} ${prev.name}</button><button id="nx" style="text-align:right"><small>다음</small>${next.icon} ${next.name}</button></div>`;
  sin.innerHTML=h;
  sin.querySelector('#bk').onclick=closeSheet;
  sin.querySelector('#pv').onclick=()=>{cur=(cur-1+MODS.length)%MODS.length;renderSheet(null);sheet.scrollTop=0};
  sin.querySelector('#nx').onclick=()=>{cur=(cur+1)%MODS.length;renderSheet(null);sheet.scrollTop=0};
  sin.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{
    const t=b.dataset.cmd, done=()=>{const e=b.querySelector('em');e.textContent='복사됨 ✓';setTimeout(()=>e.textContent='복사',1500)};
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>prompt('복사해서 Claude에 붙여넣기',t));
  });
  sin.querySelectorAll('.stbtn').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, key=m.id+':'+i; state[key]=((state[key]||0)+1)%3; save();
    const y=sheet.scrollTop; renderSheet(i); sheet.scrollTop=y; refresh();
  });
}
function closeSheet(){
  sheet.classList.add('closing');
  setTimeout(()=>{sheet.classList.remove('open','closing');document.body.classList.remove('sheet-open');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()},260);
}
document.addEventListener('keydown',e=>{
  if(!sheet.classList.contains('open'))return;
  if(e.key==='Escape')closeSheet();
  if(e.key==='ArrowRight'){cur=(cur+1)%MODS.length;renderSheet(null);sheet.scrollTop=0}
  if(e.key==='ArrowLeft'){cur=(cur-1+MODS.length)%MODS.length;renderSheet(null);sheet.scrollTop=0}
});

function refresh(){ build(); drawGrid(); drawLeft(); }
document.getElementById('btnReset').onclick=()=>{ if(confirm('모든 진행도를 초기화할까요?')){state={};save();refresh()} };
document.getElementById('btnExport').onclick=()=>{
  const txt=MODS.map(m=>`[${m.name}] ${modPct(m)}%\n`+m.items.map((it,i)=>`  ${ST[getSt(m,i)].n} ${it.n}`).join('\n')).join('\n\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('현황을 복사했습니다.')).catch(()=>prompt('복사해서 보관하세요',txt));
};
refresh(); drawUp();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
