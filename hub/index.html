<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standard Roast · 커맨드 센터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#c1622d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f5f5f7; --panel:#ffffffcc; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#c1622d; --shadow:0 8px 30px rgba(0,0,0,.08);
  --s0:#c7c7cc; --s1:#f5a623; --s2:#34c759;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --panel:#1c1c1ecc; --card:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c; --shadow:0 8px 30px rgba(0,0,0,.5); --s0:#48484a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header.top{max-width:1240px;margin:0 auto;padding:44px 24px 0;text-align:center}
.eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:clamp(34px,6vw,60px);line-height:1.08;letter-spacing:-.03em;margin:10px 0 8px;font-weight:700}
h1 span{background:linear-gradient(90deg,#c1622d,#e9a23b 55%,#7c9a44);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:clamp(15px,2vw,19px);margin:0}
.toolbar{display:flex;gap:8px;justify-content:center;margin:22px 0 0;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:980px;padding:7px 16px;font-size:13px;color:var(--muted)}
.pill:hover{color:var(--text)}

/* ---------- mind map ---------- */
.mapwrap{max-width:1240px;margin:0 auto;padding:0 12px}
#map{width:100%;height:auto;display:block;overflow:visible}
.edge{fill:none;stroke-width:1.6;opacity:.45;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.node{cursor:pointer;outline:none;opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.node .bg{transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .25s;transform-box:fill-box;transform-origin:center}
.node:hover .bg,.node:focus-visible .bg{transform:scale(1.07);filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.main .bg{stroke:none}
.leaf .bg{fill:var(--card);stroke-width:1.4}
.leaf text{fill:var(--text);font-size:12.5px;font-weight:500}
.main text.t{fill:#fff;font-size:15px;font-weight:700}
.main text.i{font-size:20px}
.center .bg{fill:var(--text)}
.center text{fill:var(--bg)}
.center .big{font-size:21px;font-weight:700;letter-spacing:-.02em}
.center .sm{font-size:12px;opacity:.7}
.ring{fill:none;stroke-width:5;stroke-linecap:round}

/* ---------- cards (mobile + below map) ---------- */
.grid{display:none;max-width:1240px;margin:20px auto 0;padding:0 16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mcard{background:var(--card);border-radius:22px;padding:20px;text-align:left;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s}
.mcard:hover{transform:translateY(-3px)}
.mcard .ic{font-size:30px}.mcard b{display:block;font-size:18px;margin-top:6px}.mcard small{color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
@media (max-width:820px){ .mapwrap{display:none} .grid{display:grid} }

/* ---------- upcoming ---------- */
.up{max-width:1240px;margin:34px auto 0;padding:0 24px}
.up h2{font-size:22px;letter-spacing:-.02em;margin:0 0 12px}
.uplist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.upc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.upc .d{font-size:28px;font-weight:700;letter-spacing:-.03em}.upc .d.hot{color:#ff3b30}
.upc span{color:var(--muted);font-size:13px}
footer{max-width:1240px;margin:44px auto;padding:0 24px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}

/* ---------- detail sheet ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);overflow-y:auto;overscroll-behavior:contain}
#sheet.open{display:block;animation:sheetin .5s cubic-bezier(.2,.8,.2,1)}
#sheet.closing{animation:sheetout .28s ease forwards}
@keyframes sheetin{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes sheetout{to{opacity:0;transform:scale(.8)}}
.sheetin{max-width:980px;margin:0 auto;padding:22px 20px 80px}
.nav{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;padding:10px 0;z-index:2}
.back{border:0;background:var(--card);border-radius:980px;padding:9px 18px;font-size:14px;box-shadow:var(--shadow)}
.hero{border-radius:28px;padding:36px 30px;color:#fff;margin-top:8px;position:relative;overflow:hidden}
.hero .ic{font-size:52px}.hero h2{font-size:clamp(30px,5vw,46px);letter-spacing:-.03em;margin:8px 0 6px}
.hero p{margin:0;opacity:.92;font-size:16px;max-width:620px;line-height:1.55}
.hero .bar{background:#ffffff40;max-width:360px}.hero .bar i{background:#fff}
.hero small{display:block;margin-top:8px;opacity:.9}
.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:30px 0 12px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s,border-color .3s}
.item.hl{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.item h3{margin:0;font-size:18px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;background:var(--bg);color:var(--muted)}
.item p{margin:0;font-size:14px;color:var(--muted);line-height:1.55}
.item .k{font-size:12px;font-weight:700;color:var(--text);display:block;margin-bottom:2px}
.stbtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;text-align:left;display:flex;align-items:center;gap:8px;margin-top:auto}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.tools{display:flex;flex-wrap:wrap;gap:8px}.tools span{background:var(--card);border:1px solid var(--line);border-radius:980px;padding:6px 14px;font-size:13px}
.mnav{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.mnav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;text-align:left}
.mnav button small{color:var(--muted);display:block}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:16px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.6;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
td,th{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}tr:last-child td{border:0}th{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:980px;padding:6px 13px;font-size:12.5px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.act em{font-style:normal;opacity:.7;font-weight:400}
.act:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Standard Roast · Command Center</div>
  <h1>브랜드의 모든 일을<br><span>한 화면</span>에서.</h1>
  <p class="lead">가지를 누르면 상세로 들어갑니다. 상태를 눌러 진행도를 기록하세요.</p>
  <div class="toolbar">
    <button class="pill" id="btnReset">진행도 초기화</button>
    <button class="pill" id="btnExport">백업 복사</button>
  </div>
</header>

<div class="mapwrap"><svg id="map" viewBox="0 0 1240 900" role="group" aria-label="Standard Roast 마인드맵"></svg></div>
<div class="grid" id="grid"></div>

<section class="up">
  <h2>다가오는 세무·정기 일정</h2>
  <div class="uplist" id="uplist"></div>
</section>

<footer>
  구상(💡) → 구축중(🔧) → 운영중(✅) 순으로 상태를 눌러 바꿉니다. 기록은 이 브라우저에만 저장됩니다.<br>
  세무 일정은 일반적인 사업자 기준 예시이며 업종·과세유형에 따라 다를 수 있으니 세무사/홈택스로 최종 확인하세요.
</footer>

<div id="sheet" aria-modal="true" role="dialog"><div class="sheetin" id="sheetin"></div></div>

const allPct=()=>{const t=MODS.reduce((a,m)=>a+m.items.length,0);const s=MODS.reduce((a,m)=>a+m.items.reduce((b,_,i)=>b+getSt(m,i),0),0);return Math.round(s/(t*2)*100)};

const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const W=1240,H=900,CX=W/2,CY=H/2;

function drawMap(){
  const svg=document.getElementById('map'); svg.innerHTML='';
  const edges=el('g',{},svg), nodes=el('g',{},svg);
  const n=MODS.length; let delay=0.05;
  MODS.forEach((m,k)=>{
    const a=-Math.PI/2+k*2*Math.PI/n;
    const mx=CX+Math.cos(a)*300, my=CY+Math.sin(a)*235;
    // center -> main
    edge(edges,CX,CY,mx,my,m.color,2.6);
    const g=el('g',{class:'node main',tabindex:0,role:'button','aria-label':m.name,style:`animation-delay:${delay+=0.06}s`},nodes);
    const w=Math.max(130,64+m.name.length*15),h=56;
    el('rect',{class:'bg',x:mx-w/2,y:my-h/2,width:w,height:h,rx:28,fill:m.color},g);
    el('text',{class:'i',x:mx-w/2+26,y:my+7,'text-anchor':'middle'},g).textContent=m.icon;
    el('text',{class:'t',x:mx+12,y:my+5,'text-anchor':'middle'},g).textContent=m.name;
    // progress ring dot
    const p=modPct(m);
    el('circle',{cx:mx+w/2-6,cy:my-h/2+6,r:8,fill:'var(--card)',stroke:m.color,'stroke-width':2},g);
    el('text',{x:mx+w/2-6,y:my-h/2+9.5,'text-anchor':'middle',style:'font-size:9px;font-weight:700;fill:var(--text)'},g).textContent=p===100?'✓':Math.floor(p/10);
    g.addEventListener('click',e=>openMod(k,null,e));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMod(k,null,e)}});
    // leaves
    const leaves=m.items.slice(0,3), offs=[-0.23,0,0.23], rf=[0.9,1,0.9];
    leaves.forEach((it,i)=>{
      const la=a+offs[i];
      const lx=CX+Math.cos(la)*540*rf[i], ly=CY+Math.sin(la)*395*rf[i];
      edge(edges,mx,my,lx,ly,m.color,1.5);
      const st=getSt(m,i);
      const lw=Math.max(84,it.s.length*13+38), lh=30;
      const lg=el('g',{class:'node leaf',tabindex:0,role:'button','aria-label':it.n,style:`animation-delay:${delay+=0.03}s`},nodes);
      el('rect',{class:'bg',x:lx-lw/2,y:ly-lh/2,width:lw,height:lh,rx:15,stroke:m.color},lg);
      el('circle',{cx:lx-lw/2+14,cy:ly,r:4.5,fill:ST[st].c.replace('var(--s0)','var(--s0)')},lg);
      el('text',{x:lx+7,y:ly+4.5,'text-anchor':'middle'},lg).textContent=it.s;
      lg.addEventListener('click',e=>openMod(k,i,e));
      lg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMod(k,i,e)}});
    });
  });
  // center
  const c=el('g',{class:'node center',style:'animation-delay:0s'},nodes);
  el('circle',{class:'bg',cx:CX,cy:CY,r:92},c);
  const pct=allPct(), R=102, C=2*Math.PI*R;
  el('circle',{class:'ring',cx:CX,cy:CY,r:R,stroke:'var(--line)'},c);
  el('circle',{class:'ring',cx:CX,cy:CY,r:R,stroke:'#34c759','stroke-dasharray':`${C*pct/100} ${C}`,transform:`rotate(-90 ${CX} ${CY})`},c);
  el('text',{x:CX,y:CY-18,'text-anchor':'middle',style:'font-size:30px'},c).textContent='☕';
  el('text',{class:'big',x:CX,y:CY+14,'text-anchor':'middle'},c).textContent='Standard Roast';
  el('text',{class:'sm',x:CX,y:CY+36,'text-anchor':'middle'},c).textContent='가동률 '+pct+'%';
}
function edge(g,x1,y1,x2,y2,color,w){
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1;
  const d=`M${x1},${y1} Q${mx-dy*0.12},${my+dx*0.12} ${x2},${y2}`;
  const p=el('path',{class:'edge',d,stroke:color,'stroke-width':w},g);
  p.style.setProperty('--len',Math.hypot(dx,dy)*1.2+10);
}

 {n:'부가세 확정신고',m:7,d:25,note:'7월 25일(상반기)'},
];
function upcoming(){
  const now=new Date(); now.setHours(0,0,0,0); const out=[];
  TAXD.forEach(t=>{
    for(let y=now.getFullYear();y<=now.getFullYear()+1;y++){
      const months=t.m===0?[...Array(12).keys()]:[t.m-1];
      months.forEach(mo=>{const dt=new Date(y,mo,t.d); if(dt>=now) out.push({...t,dt})});
    }
  });
  out.sort((a,b)=>a.dt-b.dt);
  const seen=new Set(), res=[];
  out.forEach(o=>{const k=o.n+o.dt;if(!seen.has(k)){seen.add(k);res.push(o)}});
  return res.slice(0,4).map(o=>({...o,left:Math.round((o.dt-now)/864e5)}));
}
function drawUp(){
  document.getElementById('uplist').innerHTML=upcoming().map(o=>`<div class="upc"><div class="d ${o.left<=7?'hot':''}">D-${o.left}</div><b>${o.n}</b><br><span>${o.dt.getMonth()+1}월 ${o.dt.getDate()}일 · ${o.note}</span></div>`).join('');
}

const sheet=document.getElementById('sheet'), sin=document.getElementById('sheetin');

function openMod(k,hl,ev){
  cur=k; const m=MODS[k];
  if(ev&&ev.clientX!==undefined&&ev.clientX>0){sheet.style.transformOrigin=`${ev.clientX}px ${ev.clientY}px`}else{sheet.style.transformOrigin='50% 50%'}
  lastFocus=document.activeElement;
  renderSheet(hl);
  sheet.classList.remove('closing'); sheet.classList.add('open');
  document.body.style.overflow='hidden';
  sheet.scrollTop=0;
  if(hl!==null){ setTimeout(()=>{const t=sin.querySelector('.item.hl'); if(t) t.scrollIntoView({behavior:'smooth',block:'center'})},450) }
}
function renderSheet(hl){
  const m=MODS[cur], p=modPct(m);

  <div class="sec">구성 요소 · 상태를 눌러 진행도 기록</div><div class="items">`;
  m.items.forEach((it,i)=>{
    const s=getSt(m,i);
    h+=`<div class="item ${hl===i?'hl':''}"><div class="row"><h3>${it.n}</h3><span class="badge">${LV[it.lv]}</span></div>
      <p>${it.d}</p><p><span class="k">어떻게</span>${it.how}</p><p><span class="k">다음 할 일</span>${it.next}</p>
      ${it.cmd||it.link?`<div class="acts">${it.cmd?`<button class="act cp" data-cmd="${it.cmd.replace(/"/g,'&quot;')}">⌘ ${it.cmd}<em>복사</em></button>`:''}${it.link?`<a class="act" href="${it.link[1]}" target="_blank" rel="noopener">↗ ${it.link[0]}</a>`:''}</div>`:''}
      <button class="stbtn" data-i="${i}"><span class="dot" style="background:${ST[s].c}"></span>${ST[s].n}<span style="margin-left:auto;color:var(--muted);font-weight:400">눌러서 변경</span></button></div>`;
  });
  h+='</div>';
  if(m.extra==='tax'){
    h+=`<div class="sec">세무 일정표 (일반 사업자 기준 예시)</div><table><tr><th>일정</th><th>시기</th></tr>${TAXD.map(t=>`<tr><td>${t.n}</td><td>${t.note}</td></tr>`).join('')}</table>
    <div class="note">⚠️ 과세유형(일반/간이/면세)·직원 유무·성실신고 여부에 따라 달라집니다. 신고·납부 전에는 홈택스 또는 세무사에게 반드시 확인하세요. 자동화는 "정리·알림·준비"까지만 하고, 제출은 사람이 승인하는 방식을 권장합니다.</div>`;
  }
  h+=`<div class="sec">연결 도구</div><div class="tools">${m.tools.map(t=>`<span>${t}</span>`).join('')}</div>
  <div class="mnav"><button id="pv"><small>이전</small>${prev.icon} ${prev.name}</button><button id="nx" style="text-align:right"><small>다음</small>${next.icon} ${next.name}</button></div>`;
  sin.innerHTML=h;
  sin.querySelector('#bk').onclick=closeSheet;
  sin.querySelector('#pv').onclick=()=>{cur=(cur-1+MODS.length)%MODS.length;renderSheet(null);sheet.scrollTop=0};
  sin.querySelector('#nx').onclick=()=>{cur=(cur+1)%MODS.length;renderSheet(null);sheet.scrollTop=0};
  sin.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{
    const t=b.dataset.cmd, done=()=>{const e=b.querySelector('em');e.textContent='복사됨 ✓';setTimeout(()=>e.textContent='복사',1500)};
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>prompt('복사해서 Claude에 붙여넣기',t));
  });
  sin.querySelectorAll('.stbtn').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, key=m.id+':'+i; state[key]=((state[key]||0)+1)%3; save();
    const y=sheet.scrollTop; renderSheet(i); sheet.scrollTop=y; refresh();
  });
}
function closeSheet(){
  sheet.classList.add('closing');
  setTimeout(()=>{sheet.classList.remove('open','closing');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()},260);
}
document.addEventListener('keydown',e=>{
  if(!sheet.classList.contains('open'))return;
  if(e.key==='Escape')closeSheet();
  if(e.key==='ArrowRight'){cur=(cur+1)%MODS.length;renderSheet(null);sheet.scrollTop=0}
  if(e.key==='ArrowLeft'){cur=(cur-1+MODS.length)%MODS.length;renderSheet(null);sheet.scrollTop=0}
});

function refresh(){ drawMap(); drawGrid(); }
document.getElementById('btnReset').onclick=()=>{ if(confirm('모든 진행도를 초기화할까요?')){state={};save();refresh()} };
document.getElementById('btnExport').onclick=()=>{
  const txt=MODS.map(m=>`[${m.name}] ${modPct(m)}%\n`+m.items.map((it,i)=>`  ${ST[getSt(m,i)].n} ${it.n}`).join('\n')).join('\n\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('현황을 복사했습니다.')).catch(()=>prompt('복사해서 보관하세요',txt));
};
refresh(); drawUp();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
