<style>
:root{--bg:#06080c;--card:rgba(14,17,24,.86);--text:#e8edf3;--muted:#8a96a6;--line:#222a36;--accent:#7fb6e8;--shadow:0 8px 30px rgba(0,0,0,.5);--s0:#3a4452;--s1:#ffb020;--s2:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#06080c;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none}
#stage.hov{cursor:pointer}
#tags{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tag{position:absolute;left:0;top:0;will-change:transform,opacity;pointer-events:none}
.tag .txt{position:absolute;left:0;top:0;transform:translate(-50%,0);white-space:nowrap;text-align:center}
.tag b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em;color:#fff;}
.tag small{display:block;font-size:11px;color:#8794a6;margin-top:3px;letter-spacing:.02em}
.tag i{display:block;font-style:normal;font:500 10px ui-monospace,Menlo,monospace;color:var(--c);letter-spacing:.14em;margin-bottom:3px;text-transform:uppercase}
.tag.click .txt{pointer-events:auto;cursor:pointer}
.tag.sel b{text-shadow:0 0 14px var(--c)}
.tag.sel i{color:#fff}
.tag.itm .txt{transform:translate(12px,-50%);text-align:left}
.tag.itm.r .txt{transform:translate(calc(-100% - 12px),-50%);text-align:right}
.tag.itm .txt:hover b{text-shadow:0 0 12px var(--c)}
.tag.itm b{font-size:14px}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;z-index:3;pointer-events:none}
.top>*{pointer-events:auto}
.btn{background:#0d1118cc;border:1px solid #232c3a;color:#b6c2d0;border-radius:980px;padding:7px 16px;font-size:13px;backdrop-filter:blur(8px)}
.btn:hover{color:#fff;border-color:#4a5a70}
.right{display:flex;gap:8px}
.pct{position:fixed;left:20px;bottom:16px;z-index:3;font:500 11px ui-monospace,Menlo,monospace;color:#5d6a7c;letter-spacing:.12em}
.grid{display:none;margin:70px 16px 24px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;position:relative;z-index:2}
.mcard{background:var(--card);border-radius:18px;padding:18px;text-align:left;border:1px solid var(--line)}
.mcard .ic{font-size:28px}.mcard b{display:block;font-size:17px;margin-top:4px}.mcard small{color:var(--muted)}
.bar{height:5px;border-radius:5px;background:#1a212c;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
body.no3d{overflow:auto}body.no3d #stage,body.no3d #gl,body.no3d #tags{display:none}body.no3d .grid{display:grid}
@media (max-width:640px){body{overflow:auto}#stage,#gl{display:none}.grid{display:grid}}
/* ---------- sidebar ---------- */
#side{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:5;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);background:rgba(9,12,18,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-left:1px solid #1d2531;overflow-y:auto;overscroll-behavior:contain;padding:0 0 60px}
#side.open{transform:none}
body.side-open .top .right{margin-right:min(440px,100vw)}
.sh{position:sticky;top:0;z-index:2;background:linear-gradient(#090c12 70%,#090c12cc);padding:16px 18px 12px;border-bottom:1px solid #151c27}
.sh .t{display:flex;align-items:center;gap:10px}
.sh .pl{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);flex:none}
.sh h2{margin:0;font-size:19px;letter-spacing:-.01em;flex:1}
.sh .pc{font:600 12px ui-monospace,Menlo,monospace;color:var(--c)}
.ib{background:#111722;border:1px solid #1f2836;color:#aab6c6;border-radius:8px;width:30px;height:30px;line-height:1;font-size:14px;padding:0}
.ib:hover{color:#fff;border-color:#3a4a60}
.sh .bar{margin-top:12px}
.sb{padding:14px 18px 0}
.sb p.sub{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:#98a5b6}
.sb .why{font-size:12.5px;line-height:1.6;color:#7d8a9b;background:#0e131b;border:1px solid #1a2230;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.sb .why b{color:#c8d3e0}
.gt{display:flex;justify-content:space-between;align-items:center;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#5f6e82;text-transform:uppercase;margin:20px 0 8px}
.gt button{background:none;border:0;color:#6c7b90;font-size:11px;letter-spacing:0;text-transform:none}
.gt button:hover{color:#fff}
.rw{border:1px solid #1a2230;background:#0d1119;border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.rw.hl{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.rw.ex{border-color:#2a3647}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.rh:hover{background:#111824}
.st{width:22px;height:22px;border-radius:50%;border:2px solid var(--sc);background:color-mix(in srgb,var(--sc) var(--sf),transparent);flex:none;padding:0;position:relative}
.st:hover{transform:scale(1.15)}
.rh .nm{flex:1;font-size:14.5px;font-weight:600;color:#e8edf3;min-width:0}
.rh .lv{font-size:10.5px;color:#7d8a9b;border:1px solid #232d3b;border-radius:980px;padding:2px 8px;white-space:nowrap}
.rh .ch{color:#5f6e82;transition:transform .25s;font-size:12px}
.rw.ex .ch{transform:rotate(90deg)}
.rb{display:none;padding:2px 14px 14px 44px;font-size:13px;line-height:1.6;color:#98a5b6}
.rw.ex .rb{display:block}
.rb .k{display:block;font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#5f6e82;margin:10px 0 2px;text-transform:uppercase}
.rb p{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{border:1px solid var(--c);color:var(--c);background:transparent;border-radius:980px;padding:5px 12px;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;gap:6px}
.act em{font-style:normal;opacity:.65;font-weight:400}
.act:hover{background:var(--c);color:#05080c}
.stl{margin-top:12px;display:flex;gap:6px}
.stl button{flex:1;border:1px solid #1f2836;background:#0b0f15;border-radius:8px;padding:6px 0;font-size:12px;color:#8996a8}
.stl button.on{color:#05080c;background:var(--sc);border-color:var(--sc);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:6px}.tools span{border:1px solid #1f2836;border-radius:980px;padding:4px 11px;font-size:12px;color:#98a5b6}
table{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid #1a2230;border-radius:10px;overflow:hidden}
td,th{padding:9px 11px;text-align:left;border-bottom:1px solid #1a2230}tr:last-child td{border:0}th{color:#5f6e82;font-size:11px}
.note{background:#0e131b;border:1px solid #1a2230;border-radius:10px;padding:10px 12px;font-size:12px;color:#7d8a9b;line-height:1.6;margin-top:10px}
@media (max-width:640px){#side{width:100vw;top:12vh;border-radius:18px 18px 0 0;border-left:0;border-top:1px solid #1d2531}body.side-open .top .right{margin-right:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

function tex(sz,draw){const c=document.createElement('canvas');c.width=c.height=sz;draw(c.getContext('2d'),sz);return new THREE.CanvasTexture(c)}
function makeTex(){
  T_DOT=tex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.9)');r.addColorStop(.55,'rgba(255,255,255,.25)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
  T_GLOW=tex(256,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.12,'rgba(255,255,255,.5)');r.addColorStop(.4,'rgba(255,255,255,.12)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
}
function fib(n,r){const a=[];for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,rad=Math.sqrt(Math.max(0,1-y*y)),th=i*2.399963;a.push(new THREE.Vector3(Math.cos(th)*rad*r,y*r,Math.sin(th)*rad*r))}return a}

function buildCluster(k,m){
  const items=m.items.length, r=6.2+items*.55, n=170+items*20, col=new THREE.Color(m.color);
  const g=new THREE.Group(), pts=fib(n,r);
  pts.forEach((p,i)=>{p.multiplyScalar(i%9===0?rnd(.35,.9):1+rnd(-.035,.035))});
  const pos=new Float32Array(n*3), cl=new Float32Array(n*3);
  pts.forEach((p,i)=>{pos.set([p.x,p.y,p.z],i*3);const b=.55+.45*Math.random();cl.set([col.r*b,col.g*b,col.b*b],i*3)});
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(cl,3));
  const pm=new THREE.PointsMaterial({size:.62,map:T_DOT,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  g.add(new THREE.Points(pg,pm));
  const seg=[],seen=new Set();
  pts.forEach((p,i)=>{const d=pts.map((q,j)=>[j,p.distanceToSquared(q)]).filter(x=>x[0]!==i).sort((a,b)=>a[1]-b[1]).slice(0,3);
    d.forEach(([j])=>{const key=i<j?i+'_'+j:j+'_'+i;if(seen.has(key))return;seen.add(key);seg.push(p.x,p.y,p.z,pts[j].x,pts[j].y,pts[j].z)})});
  const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(seg,3));
  const lm=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.34,blending:THREE.AdditiveBlending,depthWrite:false});
  g.add(new THREE.LineSegments(lg,lm));
  const hit=new THREE.Mesh(new THREE.SphereGeometry(r*1.05,16,12),new THREE.MeshBasicMaterial({visible:false}));hit.userData.k=k;g.add(hit);
  g.userData={k,r,pm,lm,hit,spin:rnd(.7,1.3)*(k%2?1:-1),h:0,s:0};
  g.rotation.set(rnd(0,3),rnd(0,3),0);
  return g;
}
function layout(k,n){const a=k*2*Math.PI/n-Math.PI/2+.25,R=22+(k%2)*3;return new THREE.Vector3(Math.cos(a)*R*1.15,Math.sin(a)*R*.8,((k*37)%5-2)*2.2)}
function addTag(cls,color,code,title,sub,fn,anchor,off){
  const el=document.createElement('div');el.className='tag '+cls;el.style.setProperty('--c',color);
  el.innerHTML=`<div class="txt">${code?`<i>${code}</i>`:''}${title?`<b>${title}</b>`:''}${sub?`<small>${sub}</small>`:''}</div>`;
  tagsEl.appendChild(el);
  const t={el,anchor,off:off||new THREE.Vector3(),cls};
  if(fn) el.querySelector('.txt').addEventListener('click',e=>{if(moved)return;fn(e)});
  tags.push(t);return t;
}
function build(){
  if(!HAS3D)return;
  if(world) scene.remove(world);
  world=new THREE.Group();scene.add(world);clusters=[];tags=[];tagsEl.innerHTML='';
  const n=MODS.length, core=new THREE.Group();
  const cg=new THREE.Sprite(new THREE.SpriteMaterial({map:T_GLOW,color:0xffa24d,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));cg.scale.setScalar(5);
  const cc=new THREE.Sprite(new THREE.SpriteMaterial({map:T_DOT,color:0xffffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));cc.scale.setScalar(1.3);
  core.add(cg,cc);world.add(core);
  addTag('core','#ffa24d','','','가동률 '+allPct()+'%',null,core,new THREE.Vector3(0,-2.2,0));
  MODS.forEach((m,k)=>{
    const g=buildCluster(k,m);g.position.copy(layout(k,n));world.add(g);clusters.push(g);
    const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),g.position.clone()]),new THREE.LineBasicMaterial({color:m.color,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));
    world.add(ln);g.userData.link=ln;
    g.userData.tag=addTag('click',m.color,'0'+(k+1)+' · '+modPct(m)+'%',m.name,m.items.slice(0,3).map(i=>i.s).join(' · '),()=>select(k),g,new THREE.Vector3(0,-g.userData.r*1.12,0));
  });
}
function updateLabels(){

}

function init3D(){

let last=performance.now();
const V=new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  if(!HAS3D){return}
  const dt=Math.min(50,now-last);last=now;tt+=dt/1000;
  const W=innerWidth,H=innerHeight,asp=W/H;
  // 사이드바가 열리면 장면을 왼쪽으로 밀어 행성이 가려지지 않게
  const wantSh=(sel!==null&&W>900)?SIDE_W()*.7:0; sh+=(wantSh-sh)*.1;
  const galDist=98/Math.min(1,(W-sh*1.3)/H)/zoom;
  const yw=Math.sin(tt*.12)*.07+uy, pt=Math.sin(tt*.09)*.03+up;
  camera.position.set(Math.sin(yw)*Math.cos(pt)*galDist,Math.sin(pt)*galDist,Math.cos(yw)*Math.cos(pt)*galDist);
  camera.lookAt(0,0,0);
  camera.setViewOffset(W,H,sh,0,W,H);
  clusters.forEach((g,j)=>{
    const u=g.userData, hov=(hoverK===j)?1:0, on=(sel===j)?1:0;
    u.h+=(hov-u.h)*.15; u.s+=(on-u.s)*.12;
    g.rotation.y+=dt*.00011*u.spin; g.rotation.x+=dt*.00004*u.spin;
    g.scale.setScalar(1+.05*u.h+.12*u.s);
    const dim=(sel!==null&&sel!==j)?.78:1;
    u.pm.opacity=dim*(.9+.1*Math.max(u.h,u.s)); u.lm.opacity=dim*(.3+.25*Math.max(u.h,u.s)+.15*u.s); u.link.material.opacity=.2+.35*u.s;
  });
  tags.forEach(t=>{
    V.copy(t.off).add(t.anchor.position);
    const pj=V.clone().project(camera),x=(pj.x+1)/2*W,y=(1-pj.y)/2*H,vis=pj.z<1;
    t.el.style.display=vis?'':'none';
    if(vis){t.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
      const j=clusters.findIndex(g=>g.userData.tag===t); t.el.classList.toggle('sel',j>=0&&sel===j);}
  });
  if(!drag){ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(clusters.map(g=>g.userData.hit),false);hoverK=hits.length?hits[0].object.userData.k:-1}
  stage.classList.toggle('hov',hoverK>=0);
  composer.render();
}

  if(m.extra==='tax'){
    h+=`<div class="gt"><span>세무 일정 (일반 사업자 예시)</span></div><table><tr><th>일정</th><th>시기</th></tr>${TAXD.map(t=>`<tr><td>${t.n}</td><td>${t.note}</td></tr>`).join('')}</table>
    <div class="note">⚠️ 과세유형·직원 유무에 따라 다릅니다. 신고·납부 전 홈택스 또는 세무사에게 확인하세요. 자동화는 정리·알림·준비까지, 제출은 사람이 승인하세요.</div>`;
  }
  h+=`<div class="gt"><span>연결 도구</span></div><div class="tools">${m.tools.map(t=>`<span>${t}</span>`).join('')}</div></div>`;
  const y=side.scrollTop; side.innerHTML=h; side.scrollTop=y;
  side.querySelector('#sx').onclick=closeSide;
  side.querySelector('#sp').onclick=()=>select((sel-1+n)%n);
  side.querySelector('#sn').onclick=()=>select((sel+1)%n);
  const ea=side.querySelector('#ea'); if(ea)ea.onclick=()=>{ if(exp.size)exp.clear(); else m.items.forEach((_,i)=>exp.add(i)); hlI=null; renderSide() };
  side.querySelectorAll('.rh').forEach(r=>r.onclick=e=>{
    if(e.target.closest('.st'))return; const i=+r.parentElement.dataset.i; exp.has(i)?exp.delete(i):exp.add(i); hlI=null; renderSide() });
  side.querySelectorAll('.st').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.st,key=m.id+':'+i;state[key]=((state[key]||0)+1)%3;save();renderSide();updateLabels()});
  side.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.set.split(':').map(Number);state[m.id+':'+i]=v;save();renderSide();updateLabels()});
  side.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{
    const t=b.dataset.cmd,done=()=>{const e=b.querySelector('em');e.textContent='복사됨 ✓';setTimeout(()=>e.textContent='복사',1500)};
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>prompt('복사해서 Claude에 붙여넣기',t));
  });
}
document.addEventListener('keydown',e=>{
  if(sel===null)return;
  if(e.key==='Escape')closeSide();
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){/* 스크롤 유지 */}
  if(e.key==='ArrowRight'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))select((sel+1)%MODS.length);
  if(e.key==='ArrowLeft'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))select((sel-1+MODS.length)%MODS.length);
});
function refresh(){ build(); drawGrid(); updateLabels(); if(sel!==null)renderSide() }
document.getElementById('btnReset').onclick=()=>{ if(confirm('모든 진행도를 초기화할까요?')){state={};save();refresh()} };
document.getElementById('btnExport').onclick=()=>{
  const txt=MODS.map(m=>`[${m.name}] ${modPct(m)}%\n`+m.items.map((it,i)=>`  ${ST[getSt(m,i)].n} ${it.n}`).join('\n')).join('\n\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('현황을 복사했습니다.')).catch(()=>prompt('복사해서 보관하세요',txt));
};
refresh();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
