<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMMAND CENTER</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --card2:#f0f2f5; --line:#e2e5ea; --line2:#cfd4dc;
  --text:#2d3542; --muted:#6a7483; --faint:#8d96a4;
  --accent:#2f6fe0; --accent-soft:#e8f0fd; --accent-ink:#ffffff;
  --ok:#2f8f5f; --ok-soft:#e5f4ec; --warn:#b7791f; --warn-soft:#fbf1dc; --risk:#c04e4e; --risk-soft:#faeaea;
  --shadow:0 1px 2px rgba(20,30,50,.05);
  --focus:#2f6fe0;
  --a-auto:#5877c4; --a-tax:#b98242; --a-web:#4a948f; --a-roast:#b0675f; --a-money:#5a9a6e;
  --r:12px;
}
html[data-theme="dark"]{
  --bg:#14171c; --card:#1b1f26; --card2:#222730; --line:#2c323c; --line2:#3a424f;
  --text:#dfe4ea; --muted:#a0a9b6; --faint:#7c8695;
  --accent:#6b9bf0; --accent-soft:#1f2c47; --accent-ink:#0d1422;
  --ok:#5cc38e; --ok-soft:#1a2c24; --warn:#e0b25a; --warn-soft:#2e2718; --risk:#e08a8a; --risk-soft:#33201f;
  --shadow:none; --focus:#8db2f5;
  --a-auto:#8aa4e0; --a-tax:#d9a46a; --a-web:#6fb8b2; --a-roast:#d58d85; --a-money:#7cc093;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* ---------- nav ---------- */
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 10px 16px}
.brand b{display:block;font-size:13px;letter-spacing:.18em}
.brand span{font-size:12px;color:var(--muted)}
.nb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;font-size:14px;color:var(--text);min-height:40px}
.nb:hover{background:var(--card2)}
.nb[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nb .d{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c,var(--faint))}
.nb .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav h3{margin:14px 10px 4px;font-size:11px;letter-spacing:.12em;color:var(--faint);font-weight:600}
.nav .grow{flex:1}
/* ---------- main ---------- */
.main{min-width:0;padding:24px clamp(16px,3vw,36px) 80px;max-width:1280px;width:100%}
.hd{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.hd .ey{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700}
.hd h1{margin:2px 0 2px;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.02em;line-height:1.2}
.hd p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:980px;padding:5px 12px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border:1px solid var(--line2);background:var(--card);border-radius:10px;font-size:14px;font-weight:500}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--risk);border-color:color-mix(in srgb,var(--risk) 45%,var(--line))}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.menu-btn{display:none}
/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.sum{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:16px;text-align:left;display:block;width:100%}
button.stat:hover{border-color:var(--line2);background:var(--card2)}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.stat .s{font-size:12px;color:var(--faint);margin-top:4px;min-height:18px}
.bar{height:7px;border-radius:7px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:7px;transition:width .4s}
.sec{margin-top:28px}
.sec>h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
.sec>h2 small{font-size:12.5px;font-weight:400;color:var(--muted)}
.areas{grid-template-columns:repeat(5,minmax(0,1fr))}
.acard{padding:16px;text-align:left;display:block;width:100%;border-top:3px solid var(--c)}
.acard:hover{background:var(--card2)}
.acard h3{margin:0 0 2px;font-size:15.5px}
.acard .t{font-size:12.5px;color:var(--muted)}
.acard .pc{font-size:26px;font-weight:700;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.acard .pc small{font-size:12px;font-weight:400;color:var(--muted)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;font-size:11.5px;color:var(--muted);text-align:center}
.cnt b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.guide{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:var(--r);margin-bottom:18px}
.guide b{display:block;font-size:13px;color:var(--accent);margin-bottom:1px}
.guide span{font-size:14.5px}
.banner{padding:12px 16px;border-radius:var(--r);font-size:13.5px;margin-bottom:14px;border:1px solid}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--text)}
.banner.risk{background:var(--risk-soft);border-color:color-mix(in srgb,var(--risk) 40%,var(--line))}
/* ---------- list ---------- */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.rw:hover{border-color:var(--line2)}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:11px 14px;min-height:56px}
.row:hover{background:var(--card2)}
.si{font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;min-width:78px;color:var(--text)}
.pie{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--sc,currentColor);background:conic-gradient(var(--sc,currentColor) calc(var(--p)*1%),transparent 0);flex:none;box-sizing:border-box}
.pie.hold{border-style:dashed;background:none}
.s-idea{--sc:var(--faint)}.s-build{--sc:var(--warn)}.s-test{--sc:var(--accent)}.s-live{--sc:var(--ok)}.s-hold{--sc:var(--muted)}
.rm{flex:1;min-width:0}
.rm b{display:block;font-weight:600;font-size:14.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small em{font-style:normal;color:var(--faint)}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--card2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.tg.urgent{background:var(--risk-soft);color:var(--risk);border-color:color-mix(in srgb,var(--risk) 35%,var(--line))}
.tg.low{opacity:.85}
.tg.over{background:var(--risk-soft);color:var(--risk)}
.tg.todayd{background:var(--warn-soft);color:var(--warn)}
.tg.ok{background:var(--ok-soft);color:var(--ok)}
.tg.area{border-left:3px solid var(--c)}
.star{width:48px;border:0;border-left:1px solid var(--line);background:none;font-size:18px;color:var(--faint)}
.star[aria-pressed="true"]{color:var(--warn)}
.star:hover{background:var(--card2)}
.gh{margin:18px 0 8px;font-size:12px;letter-spacing:.1em;color:var(--faint);font-weight:600}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);font-size:14px}
/* ---------- toolbar ---------- */
.tb{display:grid;gap:10px;margin-bottom:14px}
.search{position:relative}
.search input{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--card);padding:8px 14px 8px 40px}
.search:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:18px}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.fl{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.fl select,.fl input[type=date]{min-height:38px;border:1px solid var(--line2);border-radius:9px;background:var(--card);padding:5px 10px;font-size:13.5px;min-width:112px}
.ck{display:inline-flex;align-items:center;gap:8px;min-height:38px;font-size:13.5px;color:var(--text)}
.ck input{width:18px;height:18px;accent-color:var(--accent)}
.res{font-size:13px;color:var(--muted);margin:0 0 10px}
details.fold>summary{list-style:none;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
/* ---------- drawer ---------- */
.ov{position:fixed;inset:0;background:rgba(15,20,30,.38);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:41;transform:translateX(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-10px 0 40px rgba(10,20,40,.18);border-left:1px solid var(--line);overscroll-behavior:contain;visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.dh{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .tt{flex:1;min-width:0}
.dh .ar{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dh .ar i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.dh h2{margin:2px 0 0;font-size:19px;line-height:1.35;letter-spacing:-.01em}
.db{padding:16px 20px 60px;display:flex;flex-direction:column;gap:14px}
.nx{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);padding:14px 16px}
.nx label{display:block;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:6px}
.nx textarea{width:100%;min-height:68px;resize:vertical;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:9px 12px;font-size:16px;font-weight:600;line-height:1.5}
.nx .hint{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.fs{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px 16px;margin:0;min-width:0}
.fs legend{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:40px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:6px 10px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.seg button:hover{background:var(--card2)}
.seg button[aria-pressed="true"] .pie{--sc:var(--accent-ink)}
.seg button .pie{--sc:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv .fl select,.kv .fl input{width:100%}
.dx h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.dx p{margin:0;font-size:14.5px;line-height:1.65}
.dx+.dx{margin-top:12px}
.memo{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:10px 12px;line-height:1.6}
.saved{font-size:12px;color:var(--faint);min-height:18px;margin-top:4px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line2);padding:1px 0 1px 10px;line-height:1.5}
.hist li b{color:var(--text);font-weight:600}
.hist li.und{opacity:.55;text-decoration:line-through}
.note{font-size:12.5px;color:var(--muted);background:var(--card2);border-radius:9px;padding:9px 12px;line-height:1.55}
/* ---------- table/tax ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.05em}
.tbl tr:last-child td{border-bottom:0}
.pad{padding:16px}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.in{min-height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--card);padding:6px 10px}
/* ---------- dialog/toast ---------- */
dialog{border:1px solid var(--line2);border-radius:16px;padding:0;background:var(--card);color:var(--text);width:min(520px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(10,20,40,.3)}
dialog::backdrop{background:rgba(15,20,30,.5)}
dialog .in-d{padding:22px}
dialog h3{margin:0 0 8px;font-size:18px}
dialog p{margin:0 0 12px;font-size:14px;color:var(--muted)}
dialog .ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;z-index:80;transition:all .3s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ---------- responsive ---------- */
@media (max-width:1180px){.sum{grid-template-columns:repeat(3,minmax(0,1fr))}.areas{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .nav{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-105%);transition:transform .28s;visibility:hidden}
  .nav.on{transform:none;visibility:visible;box-shadow:10px 0 40px rgba(10,20,40,.2)}
  .menu-btn{display:inline-flex}
  .areas{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .main{padding:16px 14px 90px}
  .sec>h2{flex-wrap:wrap}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .areas{grid-template-columns:1fr}
  .stat .v{font-size:26px}
  .row{flex-wrap:wrap;gap:6px 10px;padding:12px}
  .si{min-width:0}
  .tags{justify-content:flex-start;width:100%}
  .rm{flex-basis:calc(100% - 100px)}
  .kv{grid-template-columns:1fr}
  .fl select,.fl input[type=date]{min-width:0;width:100%}
  .fl{flex:1 1 calc(50% - 8px)}
  .drawer{width:100vw}
  .meta{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.nav,.menu-btn{display:none}.app{display:block}}
</style>
</head>
<body>
<a class="sr" href="#main">본문으로 건너뛰기</a>
<div class="app">
  <nav class="nav" id="nav" aria-label="주 메뉴"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" aria-hidden="true"></aside>
<dialog id="dlg"><div class="in-d" id="dlgbody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" class="sr" tabindex="-1">

/* =====================================================================
   상수
   ===================================================================== */
const APP='command-center', VER=3, KEY='sr-hub-v3', OLD_KEY='sr-hub-v2', SNAP_KEY='sr-hub-v3-snapshot', THEME_KEY='sr-hub-theme';
const AREA_COLOR={auto:'var(--a-auto)',tax:'var(--a-tax)',web:'var(--a-web)',roast:'var(--a-roast)',money:'var(--a-money)'};
const STATUS={
  idea:{l:'구상',p:0,i:'○'}, build:{l:'구축 중',p:50,i:'◐'}, test:{l:'테스트 중',p:75,i:'◕'}, live:{l:'운영 중',p:100,i:'●'}, hold:{l:'보류',p:null,i:'⏸'}
};
const STATUS_ORDER=['idea','build','test','live','hold'];
const PRIO={urgent:{l:'긴급',r:0,i:'▲'},normal:{l:'보통',r:1,i:'■'},low:{l:'낮음',r:2,i:'▽'}};
const LV={A:'완전 자동 목표',S:'반자동 목표',M:'수동 유지'};
const FIELD={status:'진행 상태',priority:'중요도',due:'목표 완료일',executed:'실제 실행',today:'오늘 할 일',next:'다음 행동',memo:'메모'};
const INTEGRATIONS=[
  {id:'sheets',name:'Google Sheets',desc:'매출·재고·장부 시트 연동'},
  {id:'calendar',name:'Google Calendar',desc:'목표일·세무 일정 캘린더 연동'},
  {id:'zapier',name:'Zapier',desc:'주문 알림 등 자동화 연동'}
];

/* =====================================================================
   유틸
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const nowIso=()=>new Date().toISOString();
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00'));
const WD=['일','월','화','수','목','금','토'];
function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} (${WD[d.getDay()]})`}
function fmtShort(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function fmtTime(iso){if(!iso)return '—';const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtFull(iso){if(!iso)return '기록 없음';const d=new Date(iso);return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function daysFrom(s){const a=new Date(todayStr()+'T00:00:00'),b=new Date(s+'T00:00:00');return Math.round((b-a)/864e5)}
function clip(s,n=60){s=String(s??'');return s.length>n?s.slice(0,n)+'…':s}

/* =====================================================================
   상태 저장소
   ===================================================================== */
const AREAS=BASE.areas, TASKS=BASE.tasks, TAX_REF=BASE.taxRef;
const TASK_BY_ID=Object.fromEntries(TASKS.map(t=>[t.id,t]));
const AREA_BY_ID=Object.fromEntries(AREAS.map(a=>[a.id,a]));
let S=null, storageOk=true;

function blankTask(){return {priority:'normal',due:'',status:'idea',executed:false,today:false,memo:'',next:null,updatedAt:null}}
function blankState(){
  const tasks={};TASKS.forEach(t=>tasks[t.id]=blankTask());
  return {app:APP,version:VER,createdAt:nowIso(),savedAt:null,lastBackupAt:null,tasks,tax:[],history:[],integrations:Object.fromEntries(INTEGRATIONS.map(i=>[i.id,{connected:false}]))};
}
/* 구버전(sr-hub-v2: {"auto:0":0|1|2}) → v3 */
function migrateLegacy(){
  let raw=null;try{raw=localStorage.getItem(OLD_KEY)}catch(e){}
  if(!raw)return null;
  let old;try{old=JSON.parse(raw)}catch(e){return null}
  if(!old||typeof old!=='object')return null;
  const st=blankState();let n=0;
  TASKS.forEach(t=>{const v=old[t.legacyKey];if(v===0||v===1||v===2){n++;st.tasks[t.id].status=['idea','build','live'][v];if(v===2)st.tasks[t.id].executed=true;if(v>0)st.tasks[t.id].updatedAt=nowIso()}});
  st.history.push({id:uid(),t:nowIso(),sys:true,u:false,text:`이전 버전 데이터(${n}개 항목의 진행 상태)를 가져왔습니다. 기존 데이터는 삭제하지 않았습니다.`});
  return st;
}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
/* 불러온 객체를 안전하게 정규화 */
function normalize(raw){
  const st=blankState();
  if(!raw||typeof raw!=='object')return st;
  st.createdAt=typeof raw.createdAt==='string'?raw.createdAt:st.createdAt;
  st.savedAt=typeof raw.savedAt==='string'?raw.savedAt:null;
  st.lastBackupAt=typeof raw.lastBackupAt==='string'?raw.lastBackupAt:null;
  const src=raw.tasks&&typeof raw.tasks==='object'?raw.tasks:{};
  TASKS.forEach(t=>{const r=src[t.id];if(!r||typeof r!=='object')return;const o=st.tasks[t.id];
    if(STATUS[r.status])o.status=r.status;
    if(PRIO[r.priority])o.priority=r.priority;
    if(typeof r.due==='string'&&(r.due===''||isDate(r.due)))o.due=r.due;
    o.executed=r.executed===true;o.today=r.today===true;
    if(typeof r.memo==='string')o.memo=r.memo.slice(0,20000);
    if(typeof r.next==='string'&&r.next!==t.next)o.next=r.next.slice(0,2000);
    if(typeof r.updatedAt==='string')o.updatedAt=r.updatedAt;
  });
  if(Array.isArray(raw.tax))st.tax=raw.tax.filter(x=>x&&typeof x.name==='string'&&isDate(x.date||'')).map(x=>({id:String(x.id||uid()),name:x.name.slice(0,120),date:x.date,memo:typeof x.memo==='string'?x.memo.slice(0,1000):'',done:x.done===true}));
  if(Array.isArray(raw.history))st.history=raw.history.filter(h=>h&&typeof h==='object'&&typeof h.t==='string').slice(-600);
  if(raw.integrations&&typeof raw.integrations==='object')INTEGRATIONS.forEach(i=>{if(raw.integrations[i.id])st.integrations[i.id]={connected:false}}); // 이번 버전은 연동 미구현 → 항상 미연결
  return st;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageOk=false}
  if(raw){try{const o=JSON.parse(raw);if(o&&o.version<=VER){S=normalize(o);return}}catch(e){}}
  const mig=migrateLegacy();
  S=mig||blankState();
  if(mig)save();
}
let saveTimer=null;
function save(){
  S.savedAt=nowIso();
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}
  renderSaveChip();
}
/* =====================================================================
   업무 조회
   ===================================================================== */
function T(id){const b=TASK_BY_ID[id],s=S.tasks[id];return {...b,...s,next:s.next??b.next,nextDefault:b.next,area:AREA_BY_ID[b.areaId]}}
const allTasks=()=>TASKS.map(t=>T(t.id));
function isOverdue(t){return !!t.due&&t.due<todayStr()&&t.status!=='live'&&t.status!=='hold'}
function isDueToday(t){return t.due===todayStr()&&t.status!=='live'&&t.status!=='hold'}
function todayReasons(t){
  const r=[];
  if(t.status==='hold'&&!t.today)return r;
  if(t.status==='live'&&!t.today)return r;
  if(isOverdue(t))r.push(['over','기한 지남']);
  if(isDueToday(t))r.push(['todayd','오늘 마감']);
  if(t.priority==='urgent'&&t.status!=='live'&&t.status!=='hold')r.push(['urgent','긴급']);
  if(t.today)r.push(['todayd','오늘 지정']);
  return r;
}
const sortKey=t=>(isOverdue(t)?0:1)*1e6+PRIO[t.priority].r*1e4+(t.due?daysFrom(t.due)+500:900)
function stats(list){
  const act=list.filter(t=>t.status!=='hold');
  const sum=act.reduce((a,t)=>a+STATUS[t.status].p,0);
  const c={idea:0,build:0,test:0,live:0,hold:0};list.forEach(t=>c[t.status]++);
  return {total:list.length,active:act.length,pct:act.length?Math.round(sum/act.length):0,c,none:act.length===0};
}
/* =====================================================================
   변경 / 이력 / 실행 취소
   ===================================================================== */
function getVal(id,f){return T(id)[f]}
function applyRaw(id,f,v){
  const s=S.tasks[id],b=TASK_BY_ID[id];
  if(f==='next')s.next=(v===b.next||v==null)?null:v;else s[f]=v;
}
function fmtVal(f,v){
  if(f==='status')return STATUS[v]?.l||v;
  if(f==='priority')return PRIO[v]?.l||v;
  if(f==='executed'||f==='today')return v?'예':'아니오';
  if(f==='due')return v?fmtDate(v):'(없음)';
  return v===''||v==null?'(비어 있음)':clip(v,80);
}
function change(id,f,val,grp){
  const old=getVal(id,f);
  if(old===val)return false;
  applyRaw(id,f,val);
  S.tasks[id].updatedAt=nowIso();
  S.history.push({id:uid(),t:nowIso(),task:id,f,from:old,to:val,g:grp||uid(),u:true,undone:false});
  if(S.history.length>600)S.history.splice(0,S.history.length-600);
  save();return true;
}
function undo(){
  let i=S.history.length-1;
  while(i>=0&&!(S.history[i].u&&!S.history[i].undone))i--;
  if(i<0){toast('되돌릴 변경이 없습니다');return}
  const g=S.history[i].g;let n=0;
  for(let j=S.history.length-1;j>=0;j--){const h=S.history[j];if(h.g===g&&h.u&&!h.undone){applyRaw(h.task,h.f,h.from);S.tasks[h.task].updatedAt=nowIso();h.undone=true;n++}}
  save();toast(`실행 취소: ${n}건 되돌렸습니다`);renderAll();
}
const undoable=()=>S.history.some(h=>h.u&&!h.undone);
/* 상태 변경 규칙: 실제 실행 여부와 운영 중을 일치시킨다 */
function setStatus(id,v){
  const t=T(id);if(t.status===v)return;
  const g=uid();
  if(v==='live'&&!t.executed){
    const ok=confirm('실제 업무에 적용해서 사용 중인가요?\n\n[확인] 운영 중으로 변경하고 "실제 실행"을 체크합니다.\n[취소] 아직 적용 전이므로 "테스트 중"으로 둡니다.');
    if(ok){change(id,'executed',true,g);change(id,'status','live',g)}
    else{change(id,'status','test',g);toast('실제 적용 전이라 "테스트 중"으로 설정했습니다')}
  }else change(id,'status',v,g);
}
function setExecuted(id,v){
  const t=T(id),g=uid();
  change(id,'executed',v,g);
  if(!v&&t.status==='live'){change(id,'status','test',g);toast('실제 실행을 해제해서 "테스트 중"으로 바꿨습니다')}
}
/* 메모/다음 행동 — 입력 중 즉시 반영, 일정 시간 멈추면 이력 기록 */
const pending={};
function typing(id,f,val){
  const key=id+'|'+f;
  if(!pending[key])pending[key]={from:getVal(id,f),timer:null};
  const p=pending[key];
  applyRaw(id,f,val);S.tasks[id].updatedAt=nowIso();save();
  clearTimeout(p.timer);p.timer=setTimeout(()=>commitTyping(id,f),1500);
}
function commitTyping(id,f){
  const key=id+'|'+f,p=pending[key];if(!p)return;
  clearTimeout(p.timer);delete pending[key];
  const cur=getVal(id,f);
  if(cur===p.from)return;
  S.history.push({id:uid(),t:nowIso(),task:id,f,from:p.from,to:cur,g:uid(),u:true,undone:false});save();
  const m=$('#saved-'+f);if(m)m.textContent='저장됨 · '+fmtTime(nowIso());
}
function flushTyping(){Object.keys(pending).forEach(k=>{const [id,f]=k.split('|');commitTyping(id,f)})}

/* =====================================================================
   화면 상태
   ===================================================================== */
const V={view:'home',today:false,area:null,q:'',fArea:'',fPri:'',fStat:'',fExec:'',fDue:'',hold:true,sort:'order',openId:null,taxYear:new Date().getFullYear(),taxForm:null,navOpen:false};
function parseHash(){
  const h=(location.hash||'#home').slice(1).split('/');
  if(h[0]==='area'&&AREA_BY_ID[h[1]]){V.view='area';V.area=h[1]}
  else if(['all','tax','data','home'].includes(h[0]))V.view=h[0];else V.view='home';
}
function go(hash){
  flushTyping();
  if(location.hash==='#'+hash){parseHash();renderAll();return}
  location.hash=hash;
}
window.addEventListener('hashchange',()=>{parseHash();V.navOpen=false;renderAll();scrollTo(0,0)});

/* =====================================================================
   렌더: 공통

function renderNav(){
  const st=stats(allTasks());
  const cur=V.view==='area'?'area:'+V.area:V.view;
  const btn=(k,label,hash,extra='',c='')=>`<button class="nb" data-go="${hash}" ${cur===k?'aria-current="page"':''} ${c?`style="--c:${c}"`:''}>${extra}<span>${label}</span></button>`;
  let h=`<div class="brand"><b>COMMAND CENTER</b><span>사업 운영 대시보드</span></div>`;

  h+=`<h3>업무 영역</h3>`;
  AREAS.forEach(a=>{const s=stats(allTasks().filter(t=>t.areaId===a.id));
    h+=`<button class="nb" data-go="area/${a.id}" ${cur==='area:'+a.id?'aria-current="page"':''} style="--c:${AREA_COLOR[a.id]}"><i class="d"></i><span>${esc(a.name)}</span><span class="n">${s.pct}%</span></button>`});
  h+=`<h3>도구</h3>`+btn('tax','세무 일정','tax')+btn('data','데이터 관리','data');
  h+=`<div class="grow"></div><button class="nb" id="themeBtn" data-act="theme"><span>${document.documentElement.dataset.theme==='dark'?'☀ 밝은 화면으로':'☾ 소프트 다크로'}</span></button>`;
  const n=$('#nav');n.innerHTML=h;n.classList.toggle('on',V.navOpen);
}
function renderSaveChip(){const c=$('#saveChip');if(c)c.innerHTML=storageOk?`저장됨 · ${S.savedAt?fmtTime(S.savedAt):'—'}`:'⚠ 브라우저에 저장할 수 없음'}
function header(title,sub){
  const d=new Date();
  return `<header class="hd"><div><button class="btn sm menu-btn" data-act="menu" aria-label="메뉴 열기" style="margin-bottom:8px">☰ 메뉴</button><div class="ey">COMMAND CENTER</div><h1>${title}</h1><p>${sub}</p></div>
  <div class="meta"><span class="chip">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})</span><span class="chip" id="saveChip"></span>
  <button class="btn sm" data-act="undo" ${undoable()?'':'disabled'} title="Ctrl+Z">↩ 실행 취소</button></div></header>`;
}
function tagsFor(t,withArea){
  let h='';
  if(withArea)h+=`<span class="tg area" style="--c:${AREA_COLOR[t.areaId]}">${esc(t.area.name)}</span>`;
  h+=`<span class="tg ${t.priority==='urgent'?'urgent':t.priority==='low'?'low':''}">${PRIO[t.priority].i} ${PRIO[t.priority].l}</span>`;
  if(t.due){const d=daysFrom(t.due);
    if(isOverdue(t))h+=`<span class="tg over">${-d}일 지남 · ${fmtShort(t.due)}</span>`;
    else if(d===0&&t.status!=='live')h+=`<span class="tg todayd">오늘 마감</span>`;
    else h+=`<span class="tg">${fmtShort(t.due)}${d>0&&d<=14?` · D-${d}`:''}</span>`}
  if(t.executed)h+=`<span class="tg ok">✓ 실행 중</span>`;
  return h;
}
const pie=k=>`<i class="pie ${k==='hold'?'hold':''}" style="--p:${STATUS[k].p??0}" aria-hidden="true"></i>`;
function taskRow(t,opt={}){
  const reasons=opt.reasons?todayReasons(t):[];
  return `<li class="rw"><button class="row" data-open="${t.id}" aria-label="${esc(t.name)} 상세 열기">
    <span class="si s-${t.status}">${pie(t.status)}${STATUS[t.status].l}</span>
    <span class="rm"><b>${esc(t.name)}</b><small><em>다음 행동</em> ${esc(clip(t.next,70))}</small></span>
    <span class="tags">${reasons.map(r=>`<span class="tg ${r[0]}">${r[1]}</span>`).join('')}${tagsFor(t,opt.area)}</span></button>
    <button class="star" data-act="today" data-id="${t.id}" aria-pressed="${t.today}" aria-label="오늘 할 일로 ${t.today?'해제':'지정'}" title="오늘 할 일로 지정">${t.today?'★':'☆'}</button></li>`;
}
/* =====================================================================

function renderHome(){
  const all=allTasks(), st=stats(all), td=todayStr();
  const todayList=all.filter(t=>todayReasons(t).length).sort((a,b)=>sortKey(a)-sortKey(b));
  const urgent=all.filter(t=>t.priority==='urgent'&&t.status!=='live'&&t.status!=='hold').length;
  const overdue=all.filter(isOverdue);
  const attention=all.filter(t=>(t.priority==='urgent'&&t.status!=='live'&&t.status!=='hold')||isOverdue(t)).sort((a,b)=>sortKey(a)-sortKey(b));
  let guide;
  if(todayList.length)guide=[`오늘 가장 먼저 할 일`,`${esc(todayList[0].name)} — ${esc(clip(todayList[0].next,60))}`,todayList[0].id];
  else if(all.every(t=>!t.due&&t.status==='idea'&&t.priority==='normal'))guide=['시작하기','업무의 중요도와 목표 완료일을 정하면 "오늘의 업무"가 자동으로 만들어집니다. 먼저 가장 급한 업무를 열어보세요.',null];
  else guide=['오늘 지정된 업무가 없습니다','긴급 업무나 구축 중인 업무의 다음 행동을 확인하고, 목표 완료일을 정해 보세요.',null];
  const recent=S.history.filter(h=>!h.undone).slice(-8).reverse();
  const card=(k,v,sub,flt,unit='')=>`<button class="card stat" data-flt='${esc(JSON.stringify(flt||{}))}'><div class="k">${k}</div><div class="v">${v}<small>${unit}</small></div><div class="s">${sub}</div></button>`;

function applyFilters(list){
  const q=V.q.trim().toLowerCase(), td=todayStr();
  let r=list.filter(t=>{
    if(V.view==='all'&&V.fArea&&t.areaId!==V.fArea)return false;
    if(V.fPri&&t.priority!==V.fPri)return false;
    if(V.fStat){if(V.fStat==='open'){if(t.status==='live'||t.status==='hold')return false}else if(t.status!==V.fStat)return false}
    if(V.fExec==='yes'&&!t.executed)return false;
    if(V.fExec==='no'&&t.executed)return false;
    if(V.fDue){
      if(V.fDue==='none'&&t.due)return false;
      if(V.fDue==='set'&&!t.due)return false;
      if(V.fDue==='over'&&!isOverdue(t))return false;
      if(V.fDue==='today'&&t.due!==td)return false;
      if(V.fDue==='week'){if(!t.due||t.due<td||daysFrom(t.due)>7)return false}
    }
    if(!V.hold&&t.status==='hold')return false;
    if(V.today&&!todayReasons(t).length)return false;
    if(q){const hay=(t.name+' '+t.desc+' '+t.next+' '+t.memo+' '+t.short).toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
    return true;
  });
  const idx=Object.fromEntries(TASKS.map((t,i)=>[t.id,i]));
  const by={
    order:(a,b)=>idx[a.id]-idx[b.id],
    priority:(a,b)=>PRIO[a.priority].r-PRIO[b.priority].r||idx[a.id]-idx[b.id],
    due:(a,b)=>(a.due?0:1)-(b.due?0:1)||a.due.localeCompare(b.due)||idx[a.id]-idx[b.id],
    status:(a,b)=>STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)||idx[a.id]-idx[b.id],
    updated:(a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')||idx[a.id]-idx[b.id]
  };
  return r.sort(by[V.sort]||by.order);
}

/* 가져오기 검증: 오류 문자열 배열과 정규화된 상태를 돌려준다 */
function validateImport(text){
  const errs=[];let doc;
  try{doc=JSON.parse(text)}catch(e){return {errs:['올바른 JSON 형식이 아닙니다.']}}
  if(!doc||typeof doc!=='object'||Array.isArray(doc))return {errs:['최상위 구조가 올바르지 않습니다.']};
  if(doc.app!==APP)errs.push('이 프로그램에서 내보낸 파일이 아닙니다(app 값 불일치).');
  if(typeof doc.version!=='number')errs.push('데이터 버전 정보가 없습니다.');
  else if(doc.version>VER)errs.push(`지원하지 않는 데이터 버전입니다(파일 v${doc.version} / 지원 v${VER} 이하).`);
  if(!Array.isArray(doc.tasks))errs.push('업무 데이터(tasks)가 없습니다.');
  if(errs.length)return {errs};
  let known=0,unknown=0;const tasks={};
  doc.tasks.forEach((r,i)=>{
    if(!r||typeof r!=='object'||typeof r.id!=='string'){errs.push(`업무 ${i+1}번: id가 없습니다.`);return}
    if(!TASK_BY_ID[r.id]){unknown++;return}
    known++;
    if(r.status!==undefined&&!STATUS[r.status])errs.push(`${r.id}: 알 수 없는 진행 상태 "${r.status}"`);
    if(r.priority!==undefined&&!PRIO[r.priority])errs.push(`${r.id}: 알 수 없는 중요도 "${r.priority}"`);
    if(r.due!==undefined&&r.due!==''&&!(typeof r.due==='string'&&isDate(r.due)))errs.push(`${r.id}: 목표일 형식 오류`);
    if(r.executed!==undefined&&typeof r.executed!=='boolean')errs.push(`${r.id}: 실제 실행 값이 올바르지 않습니다.`);
    if(r.memo!==undefined&&typeof r.memo!=='string')errs.push(`${r.id}: 메모 형식 오류`);
    tasks[r.id]={priority:r.priority,due:r.due,status:r.status,executed:r.executed,today:r.today,memo:r.memo,next:r.next,updatedAt:r.updatedAt};
  });
  if(known===0)errs.push('인식 가능한 업무가 하나도 없습니다.');
  if(doc.taxConfirmed!==undefined&&!Array.isArray(doc.taxConfirmed))errs.push('세무 확정 일정 형식 오류');
  if(doc.history!==undefined&&!Array.isArray(doc.history))errs.push('변경 이력 형식 오류');
  if(errs.length)return {errs:errs.slice(0,8).concat(errs.length>8?[`…외 ${errs.length-8}건`]:[])};
  return {errs:[],doc,tasks,known,unknown,count:doc.tasks.length};
}
function snapshot(){try{localStorage.setItem(SNAP_KEY,JSON.stringify({at:nowIso(),data:S}))}catch(e){}}
function importFlow(file){
  if(!file)return;
  if(file.size>5*1024*1024){showDlg(`<h3>가져올 수 없음</h3><p>파일이 너무 큽니다(5MB 초과).</p><div class="ft"><button class="btn" data-act="dclose">닫기</button></div>`);return}
  const rd=new FileReader();
  rd.onerror=()=>toast('파일을 읽지 못했습니다');
  rd.onload=()=>{
    const v=validateImport(String(rd.result));
    if(v.errs.length){showDlg(`<h3>가져올 수 없는 파일입니다</h3><p>기존 데이터는 그대로 유지됩니다(덮어쓰지 않았습니다).</p><ul style="font-size:13.5px;color:var(--risk);padding-left:18px;margin:0 0 4px">${v.errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><div class="ft"><button class="btn" data-act="dclose">닫기</button></div>`);return}
    window.__imp=v;
    showDlg(`<h3>JSON 가져오기</h3><p>파일 내보낸 시각: <b>${fmtFull(v.doc.exportedAt)}</b><br>인식된 업무 ${v.known}개${v.unknown?` · 알 수 없는 업무 ${v.unknown}개(무시)`:''} · 세무 확정 일정 ${(v.doc.taxConfirmed||[]).length}건 · 변경 이력 ${(v.doc.history||[]).length}건</p>
     <fieldset class="fs" style="margin-bottom:8px"><legend>가져오기 방식</legend>
      <label class="ck"><input type="radio" name="imode" value="replace" checked> <span><b>전체 교체</b> — 현재 데이터를 파일 내용으로 바꿉니다(파일에 없는 변경은 사라집니다)</span></label>
      <label class="ck" style="align-items:flex-start"><input type="radio" name="imode" value="merge" style="margin-top:9px"> <span><b>병합</b> — 파일에 있는 업무만 파일 값으로 덮어쓰고, 나머지 업무는 현재 값을 유지합니다. 세무 일정·변경 이력은 합칩니다</span></label></fieldset>
     <p>가져오기 직전의 현재 상태는 자동으로 저장되어 <b>데이터 관리 → 그 상태로 되돌리기</b>로 복구할 수 있습니다. 그래도 먼저 현재 데이터를 JSON으로 백업하는 것을 권장합니다.</p>
     <div class="ft"><button class="btn" data-act="export">현재 데이터 백업</button><button class="btn" data-act="dclose">취소</button><button class="btn pri" data-act="doimport">가져오기 실행</button></div>`);
  };
  rd.readAsText(file);
}
function doImport(mode){
  const v=window.__imp;if(!v)return;
  snapshot();
  const incoming=normalize({tasks:Object.fromEntries(Object.entries(v.tasks).map(([k,r])=>[k,{...blankTask(),...Object.fromEntries(Object.entries(r).filter(([,x])=>x!==undefined))}])),tax:v.doc.taxConfirmed,history:v.doc.history});
  if(mode==='replace'){
    const keep={lastBackupAt:S.lastBackupAt,createdAt:S.createdAt};
    const nt=blankState();
    Object.keys(v.tasks).forEach(id=>nt.tasks[id]=incoming.tasks[id]);
    nt.tax=incoming.tax;nt.history=incoming.history;nt.lastBackupAt=keep.lastBackupAt;nt.createdAt=keep.createdAt;
    S=nt;
  }else{
    Object.keys(v.tasks).forEach(id=>S.tasks[id]=incoming.tasks[id]);
    const ids=new Set(S.tax.map(x=>x.id));incoming.tax.forEach(x=>{if(!ids.has(x.id))S.tax.push(x)});
    const hid=new Set(S.history.map(h=>h.id));incoming.history.forEach(h=>{if(!hid.has(h.id))S.history.push(h)});
    S.history.sort((a,b)=>a.t.localeCompare(b.t));
  }
  S.history.push({id:uid(),t:nowIso(),sys:true,u:false,text:`JSON 파일을 가져왔습니다(${mode==='replace'?'전체 교체':'병합'}, 업무 ${v.known}개).`});
  save();window.__imp=null;closeDlg();renderAll();toast('가져오기를 완료했습니다');
}

}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-open],[data-act],[data-flt]');
  if(!el){return}
  if(el.dataset.go){go(el.dataset.go);return}
  if(el.dataset.open){openTask(el.dataset.open);return}
  if(el.dataset.flt!==undefined&&!el.dataset.act){
    const f=JSON.parse(el.dataset.flt);
    Object.assign(V,{q:'',fArea:'',fPri:'',fStat:'',fExec:'',fDue:'',hold:true,sort:'order',today:false},f);
    V.today=!!f.today;V.view='all';
    if(location.hash!=='#all')location.hash='all';else renderAll();
    return;
  }
  const a=el.dataset.act, id=el.dataset.id||V.openId;
  switch(a){
    case 'menu':V.navOpen=!V.navOpen;renderNav();break;
    case 'theme':{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem(THEME_KEY,n)}catch(e){}renderNav();break}
    case 'undo':undo();break;
    case 'today':{const t=T(id);change(id,'today',!t.today);renderAll();break}
    case 'status':setStatus(V.openId,el.dataset.v);renderAll();break;
    case 'prio':change(V.openId,'priority',el.dataset.v);renderAll();break;
    case 'duenone':change(V.openId,'due','');renderAll();break;
    case 'nextreset':{flushTyping();change(V.openId,'next',TASK_BY_ID[V.openId].next);renderAll();break}
    case 'closed':closeTask();break;
    case 'copy':{const t=decodeURIComponent(el.dataset.cmd);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했습니다')).catch(()=>{prompt('복사해서 사용하세요',t)});break}
    case 'clearf':Object.assign(V,{q:'',fArea:'',fPri:'',fStat:'',fExec:'',fDue:'',hold:true,sort:'order',today:false});renderAll();break;
    case 'export':exportData();break;
    case 'import':$('#file').value='';$('#file').click();break;
    case 'doimport':{const m=($('input[name=imode]:checked')||{}).value||'replace';doImport(m);break}
    case 'dclose':closeDlg();break;
    case 'restoresnap':restoreSnap();break;
    case 'reset':resetFlow();break;
    case 'doreset':doReset();break;
    case 'taxnew':V.taxForm={name:'',date:'',memo:''};renderAll();break;
    case 'taxcancel':V.taxForm=null;renderAll();break;
    case 'taxfromref':{const r=TAX_REF[+el.dataset.i];V.taxForm={name:r.n,date:'',memo:'',hint:`참고: 일반적으로 ${r.note}. 실제 신고일은 사업자 유형에 따라 다르므로 직접 확인한 날짜를 입력하세요.`};renderAll();$('#taxForm')&&$('#taxForm').scrollIntoView({block:'center',behavior:reduceMotion()?'auto':'smooth'});break}
    case 'taxedit':{const x=S.tax.find(z=>z.id===id);if(x){V.taxForm={...x};renderAll();$('#taxForm')&&$('#taxForm').scrollIntoView({block:'center'})}break}
    case 'taxdone':{const x=S.tax.find(z=>z.id===id);if(x){x.done=!x.done;S.history.push({id:uid(),t:nowIso(),sys:true,u:false,text:`세무 일정 "${x.name}" ${x.done?'완료 처리':'완료 취소'}`});save();renderAll()}break}
    case 'taxdel':{const x=S.tax.find(z=>z.id===id);if(x&&confirm(`"${x.name}" 일정을 삭제할까요?`)){S.tax=S.tax.filter(z=>z.id!==id);S.history.push({id:uid(),t:nowIso(),sys:true,u:false,text:`세무 일정 "${x.name}" 삭제`});save();renderAll()}break}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='taxForm')return;e.preventDefault();
  const fd=new FormData(e.target),name=String(fd.get('name')||'').trim(),date=String(fd.get('date')||''),memo=String(fd.get('memo')||'').trim();
  if(!name||!isDate(date)){toast('이름과 날짜를 확인하세요');return}
  const f=V.taxForm;
  if(f&&f.id){const x=S.tax.find(z=>z.id===f.id);if(x){x.name=name;x.date=date;x.memo=memo}S.history.push({id:uid(),t:nowIso(),sys:true,u:false,text:`세무 일정 "${name}" 수정(${date})`})}
  else{S.tax.push({id:uid(),name,date,memo,done:false});S.history.push({id:uid(),t:nowIso(),sys:true,u:false,text:`세무 확정 일정 "${name}" 입력(${date})`})}
  V.taxYear=+date.slice(0,4);V.taxForm=null;save();renderAll();toast('저장했습니다');
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f==='q'){V.q=el.value;renderAll();return}
  if(el.dataset.t==='next'||el.dataset.t==='memo'){
    typing(V.openId,el.dataset.t,el.value);
    const s=$('#saved-'+el.dataset.t);if(s)s.textContent='저장 중…';
    const u=$('#upd');if(u)u.textContent=fmtFull(S.tasks[V.openId].updatedAt);
  }
  if(el.id==='rs1'||el.id==='rs2'){const ok=$('#rs1').checked&&$('#rs2').value.trim()==='초기화';$('#rsgo').disabled=!ok}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f&&el.dataset.f!=='q'){
    const f=el.dataset.f;
    if(f==='hold')V.hold=el.checked;else if(f==='taxYear')V.taxYear=+el.value;else V[f]=el.value;
    if(f==='fStat'||f==='fPri'||f==='fExec'||f==='fDue')V.today=false;
    renderAll();return;
  }
  if(el.dataset.t==='due'){change(V.openId,'due',el.value);renderAll();}
  if(el.dataset.t==='executed'){setExecuted(V.openId,el.checked);renderAll()}
  if(el.id==='file'){importFlow(el.files[0])}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#dlg').open)return;
    if(V.openId){closeTask();return}
    if(V.navOpen){V.navOpen=false;renderNav()}
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){e.preventDefault();undo()}
  if(e.key==='Tab'&&V.openId){ // 패널 안에서 포커스 유지
    const f=$$('button:not([disabled]),input,select,textarea,a[href]','#drawer').filter(x=>x.offsetParent!==null);
    if(f.length){const first=f[0],last=f[f.length-1];
      if(!$('#drawer').contains(document.activeElement)){e.preventDefault();first.focus()}
      else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
  }
});
$('#ov').addEventListener('click',closeTask);
window.addEventListener('beforeunload',flushTyping);
window.addEventListener('pagehide',flushTyping);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushTyping()});

/* =====================================================================
   시작
   ===================================================================== */
try{const th=localStorage.getItem(THEME_KEY);if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(e){}
load();parseHash();renderAll();
</script>
</body>
</html>
