<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생두 트래커</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2a2118;--mu:#7a6f5e;--bd:#e7dcc0;--ac:#5f7a30;--new:#c1622d;--red:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#1c1814;--card:#262019;--tx:#f0e8da;--mu:#a89c88;--bd:#3a3128;--ac:#9bbd5a;--new:#e88a55;--red:#e0675c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
header{padding:16px;max-width:1100px;margin:auto}h1{margin:0;font-size:22px}.sub{color:var(--mu);font-size:13px}
.wrap{max-width:1100px;margin:auto;padding:0 16px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input,select{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input{flex:1;min-width:160px}
.tabs{display:flex;gap:6px;margin:8px 0}.tab{padding:7px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);cursor:pointer;color:var(--tx);font:inherit}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--ac)}.card.so{opacity:.55}
.co{font-size:12px;color:var(--mu)}.nm{font-weight:600}.pr{font-size:17px;font-weight:700}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;margin-right:4px}
.b-new{background:var(--new)}.b-so{background:var(--red)}.b-re{background:var(--ac)}.b-or{background:var(--mu)}
.ev{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:block;text-decoration:none;color:inherit}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:20px;color:var(--ac)}.stat span{font-size:11px;color:var(--mu)}
.empty{color:var(--mu);padding:30px;text-align:center}
.err{color:var(--red);font-size:13px}
</style>
</head>
<body>
<header><h1>☕ 생두 트래커</h1><div class="sub" id="upd"></div><div class="err" id="err"></div></header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tabs"><button class="tab on" data-t="list">전체 목록</button><button class="tab" data-t="feed">업데이트 피드</button></div>
  <div class="bar" id="filters">
    <input id="q" placeholder="검색 (예: 게이샤, 에티오피아, 내추럴)">
    <select id="co"><option value="">전체 업체</option></select>
    <select id="or"><option value="">전체 원산지</option></select>
    <select id="st"><option value="">판매중만</option><option value="all">품절 포함</option><option value="new">신규(7일)</option></select>
    <select id="so"><option value="new">최신순</option><option value="pa">가격 낮은순</option><option value="pd">가격 높은순</option></select>
  </div>
  <div id="out"></div>
</div>
<script>
const DATA={"beans": {"demo|https://example.com/product/eth-guji": {"name": "[에티오피아] 구지 우라가 G1 내추럴 15kg", "url": "https://example.com/product/eth-guji", "price": 225000, "image": "https://example.com/img/1.jpg", "soldout": false, "origin": "에티오피아", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "first_seen": "2026-10-04T15:09:43+09:00", "last_seen": "2026-10-04T15:09:43+09:00", "baseline": true, "status": "on_sale", "price_history": [["2026-10-04T15:09:43+09:00", 210000], ["2026-10-04T15:09:43+09:00", 225000]]}, "demo|https://example.com/product/col-huila": {"name": "[콜롬비아] 후일라 수프리모 19up 35kg", "url": "https://example.com/product/col-huila", "price": 385000, "image": "https://example.com/img/2.jpg", "soldout": false, "origin": "콜롬비아", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "first_seen": "2026-10-04T15:09:43+09:00", "last_seen": "2026-10-04T15:09:43+09:00", "baseline": true, "status": "soldout", "price_history": [["2026-10-04T15:09:43+09:00", 385000]]}, "demo|https://example.com/product/bra-santos": {"name": "[브라질] 산토스 NY2 FC 60kg", "url": "https://example.com/product/bra-santos", "price": 298000, "image": "https://example.com/img/3.jpg", "soldout": true, "origin": "브라질", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "first_seen": "2026-10-04T15:09:43+09:00", "last_seen": "2026-10-04T15:09:43+09:00", "baseline": true, "status": "on_sale", "price_history": [["2026-10-04T15:09:43+09:00", 298000]]}, "demo|https://example.com/product/pan-gesha": {"name": "[파나마] 보케테 게이샤 워시드 5kg (항공)", "url": "https://example.com/product/pan-gesha", "price": 1450000, "image": "https://example.com/img/4.jpg", "soldout": false, "origin": "파나마", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "first_seen": "2026-10-04T15:09:43+09:00", "last_seen": "2026-10-04T15:09:43+09:00", "baseline": false, "status": "on_sale", "price_history": [["2026-10-04T15:09:43+09:00", 1450000]]}}, "events": [{"time": "2026-10-04T15:09:43+09:00", "type": "price_change", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "name": "[에티오피아] 구지 우라가 G1 내추럴 15kg", "url": "https://example.com/product/eth-guji", "price": 225000, "old_price": 210000}, {"time": "2026-10-04T15:09:43+09:00", "type": "soldout", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "name": "[콜롬비아] 후일라 수프리모 19up 35kg", "url": "https://example.com/product/col-huila", "price": 385000}, {"time": "2026-10-04T15:09:43+09:00", "type": "restock", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "name": "[브라질] 산토스 NY2 FC 60kg", "url": "https://example.com/product/bra-santos", "price": 298000}, {"time": "2026-10-04T15:09:43+09:00", "type": "new", "source": "demo", "source_name": "데모 생두상회 (예시 데이터)", "name": "[파나마] 보케테 게이샤 워시드 5kg (항공)", "url": "https://example.com/product/pan-gesha", "price": 1450000}], "status": {"updated": "2026-10-04T15:09:43+09:00", "sources": {"demo": {"name": "데모 생두상회 (예시 데이터)", "ok": true, "count": 4, "time": "2026-10-04T15:09:43+09:00"}}}};
const $=s=>document.querySelector(s),LAB={new:"🆕 신규",restock:"🔄 재입고",soldout:"⛔ 품절",price_change:"💰 가격변동",removed:"🗑 판매종료"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>n?n.toLocaleString()+"원":"가격 문의";
let beans=[],events=[],tab="list";
const isNew=b=>!b.baseline&&Date.now()-new Date(b.first_seen)<7*864e5;
function load(){
  const {beans:b,events:e,status:s}=DATA;
  beans=Object.values(b).filter(x=>x.status!=="removed");events=e;
  $("#upd").textContent="마지막 갱신 "+s.updated.replace("T"," ").slice(0,16)+" · 상품 "+beans.length+"개";
  const bad=Object.values(s.sources).filter(x=>!x.ok);
  $("#err").textContent=bad.length?"⚠ 수집 실패: "+bad.map(x=>x.name).join(", "):"";
  fill("#co",[...new Set(beans.map(x=>x.source_name))]);fill("#or",[...new Set(beans.map(x=>x.origin).filter(Boolean))].sort());
  const week=Date.now()-7*864e5,ev7=events.filter(e=>new Date(e.time)>week);
  $("#stats").innerHTML=[["전체 상품",beans.length],["판매중",beans.filter(x=>x.status==="on_sale").length],["7일 신규",ev7.filter(e=>e.type==="new").length],["7일 재입고",ev7.filter(e=>e.type==="restock").length]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
  render();
}
function fill(sel,vals){vals.forEach(v=>$(sel).insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`))}
function render(){
  $("#filters").style.display=tab==="list"?"flex":"none";
  if(tab==="feed"){
    $("#out").innerHTML=events.filter(e=>e.type!=="removed").map(e=>`<a class="ev" href="${esc(e.url)}" target="_blank" rel="noopener"><span class="co">${esc(e.time.slice(0,16).replace("T"," "))} · ${esc(e.source_name)}</span><br><b>${LAB[e.type]}</b> ${esc(e.name)} · ${e.type==="price_change"?won(e.old_price)+" → ":""}${won(e.price)}</a>`).join("")||'<div class="empty">아직 변동 내역이 없어요. 수집이 한 번 더 돌면 여기에 쌓입니다.</div>';
    return;
  }
  const q=$("#q").value.trim().toLowerCase(),co=$("#co").value,or=$("#or").value,st=$("#st").value,so=$("#so").value;
  let l=beans.filter(b=>(!q||(b.name+b.source_name).toLowerCase().includes(q))&&(!co||b.source_name===co)&&(!or||b.origin===or)&&(st==="all"||b.status==="on_sale"||st==="new")&&(st!=="new"||isNew(b)));
  l.sort((a,b)=>so==="pa"?(a.price||1e12)-(b.price||1e12):so==="pd"?(b.price||0)-(a.price||0):b.first_seen.localeCompare(a.first_seen));
  $("#out").innerHTML=l.length?`<div class="grid">${l.map(b=>`<a class="card ${b.status==="soldout"?"so":""}" href="${esc(b.url)}" target="_blank" rel="noopener"><span class="co">${esc(b.source_name)}</span><span class="nm">${esc(b.name)}</span><span>${isNew(b)?'<span class="badge b-new">NEW</span>':""}${b.status==="soldout"?'<span class="badge b-so">품절</span>':""}${b.origin?`<span class="badge b-or">${esc(b.origin)}</span>`:""}</span><span class="pr">${won(b.price)}</span></a>`).join("")}</div>`:'<div class="empty">조건에 맞는 생두가 없어요.</div>';
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));tab=t.dataset.t;render()});
["q","co","or","st","so"].forEach(i=>$("#"+i).addEventListener("input",render));
load();
</script>
</body>
</html>
